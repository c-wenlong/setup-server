title = "setup-server gitleaks config"

# Start from the bundled ruleset and narrow it, rather than replacing it.
[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Allowlists
#
# Every entry below is scoped by BOTH a path and the literal string it is
# forgiving (condition = "AND"), so a real secret landing in the same file is
# still caught. There is deliberately no path-wide allowlist for tests/stubs/:
# the stubs are ordinary shell scripts and a genuine credential pasted into one
# must still fail the scan.
# ---------------------------------------------------------------------------

[[allowlists]]
description = """
Home Assistant's curl stub replays the /auth/token response the real HA emits, \
and gitleaks' generic-api-key rule reads the fake bearer token as a JWT. The \
value is a header-only JWT whose payload is the literal word "stub"; it has no \
signature, decodes to nothing, and is never sent anywhere but the mocked suite.
"""
targetRules = ["generic-api-key", "jwt", "jwt-base64"]
condition = "AND"
paths = ['''^services/home-assistant/tests/stubs/curl$''']
regexes = ['''eyJhbGciOiJIUzI1NiJ9\.stub''']

[[allowlists]]
description = """
Hermes' live suite asserts the dashboard refuses a bad password by curling \
with '-u $user:wrong-password'. The "secret" is a shell variable plus the \
literal words 'wrong-password' — a deliberately invalid credential that \
exists only so the check can prove it does not authenticate. Scoped to this \
one literal in this one file; a real password landing here still fails.
"""
targetRules = ["curl-auth-user"]
condition = "AND"
paths = ['''^services/hermes-agent/tests/run-tests\.sh$''']
regexes = ['''\$user:wrong-password''']

# ---------------------------------------------------------------------------
# Note on */.env
#
# A deployed box has real credentials in services/<service>/.env (setup.sh generates
# them). Those files are gitignored and never tracked, so `gitleaks git` and
# the pre-commit hook (staged content only) do not see them. `gitleaks dir .`
# run on a deployed box WILL report them, and that is correct behaviour, not a
# false positive. They are not allowlisted here on purpose: if a .env ever gets
# staged, the scan must fail loudly. scripts/check-structure.sh independently
# asserts that no .env is tracked.
# ---------------------------------------------------------------------------
