title = "setup-server gitleaks config"

# Start from the bundled ruleset and narrow it, rather than replacing it.
[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Allowlist
#
# CI's gitleaks 8.24 predates the [[allowlists]] array form and silently
# ignores it, so this file uses the singular [allowlist] table — deprecated on
# newer releases but honoured by every version. TOML allows exactly one, so
# the two scoped literals below share it: a finding is suppressed only when
# its path matches one of `paths` AND its secret matches one of `regexes`
# (condition = "AND"). Both regexes name exact inert strings, not wildcards,
# so a real secret landing in either file is still caught. There is
# deliberately no path-wide allowlist for tests/stubs/: the stubs are
# ordinary shell scripts and a genuine credential pasted into one must still
# fail the scan.
#
#   1. Home Assistant's curl stub replays the /auth/token response the real
#      HA emits, and the generic-api-key rule reads the fake bearer token as
#      a JWT. The value is a header-only JWT whose payload is the literal
#      word "stub"; it has no signature, decodes to nothing, and is never
#      sent anywhere but the mocked suite.
#   2. Hermes' live suite asserts the dashboard refuses a bad password by
#      curling with '-u $user:wrong-password'. The "secret" is a shell
#      variable plus the literal words 'wrong-password' — a deliberately
#      invalid credential that exists only so the check can prove it does
#      not authenticate.
# ---------------------------------------------------------------------------
[allowlist]
description = "Scoped false positives: HA stub JWT and hermes' fake wrong-password curl credential (see comments above)."
targetRules = ["curl-auth-user", "generic-api-key", "jwt", "jwt-base64"]
condition = "AND"
paths = [
  '''^services/home-assistant/tests/stubs/curl$''',
  '''^services/hermes-agent/tests/run-tests\.sh$''',
]
regexes = [
  '''eyJhbGciOiJIUzI1NiJ9\.stub''',
  '''\$user:wrong-password''',
]

# ---------------------------------------------------------------------------
# Note on */.env
#
# A deployed box has real credentials in services/<service>/.env (setup.sh generates
# them). Those files are gitignored and never tracked, so `gitleaks git` and
# the pre-commit hook (staged content only) do not see them. `gitleaks dir .`
# run on a deployed box WILL report them, and that is correct behaviour, not a
# false positive. They are not allowlisted here on purpose: if a .env ever gets
# staged, the scan must fail loudly. scripts/check-structure.sh independently
# asserts that no .env is tracked.
# ---------------------------------------------------------------------------
