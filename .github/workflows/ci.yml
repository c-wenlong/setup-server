name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to a branch makes the first run's result worthless, and the
# mocked-suite matrix is 20 jobs wide.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. No job here writes to the repo, and the Codecov upload
# uses a token rather than OIDC, so nothing needs id-token: write either.
permissions:
  contents: read

# Every third-party action below is pinned to a full commit SHA with the tag in
# a trailing comment, so a moved tag cannot change what runs. Dependabot
# (.github/dependabot.yml) bumps the SHA and rewrites the comment.

jobs:
  lint:
    name: Lint (shellcheck, structure, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck (pinned)
        # The runner image ships a ShellCheck, but its version moves with the
        # image. A pinned release keeps "green on my machine" and "green in CI"
        # the same statement: a new ShellCheck cannot turn a run red without
        # someone bumping this line on purpose. Keep it in step with the
        # SHELLCHECK_VERSION in the Makefile and the shellcheck-py rev in
        # .pre-commit-config.yaml.
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o /tmp/shellcheck.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: make lint
        # Deliberately the same entry point a contributor runs locally:
        # shellcheck over every shell file, the per-service contract check, and
        # actionlint over the workflows. Both tools are installed above, so the
        # "skip with a notice" branch in the Makefile does not fire here.
        run: make lint

  discover-suites:
    name: Discover mocked suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.find.outputs.services }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built at runtime rather than hardcoded so that adding a service (the
      # checklist in AGENTS.md) needs no edit here: drop in
      # <service>/tests/run-tests.sh and CI picks it up. The Makefile's
      # SERVICES variable discovers the same set the same way.
      - name: Build the service matrix
        id: find
        run: |
          set -euo pipefail
          services="$(
            find . -mindepth 3 -maxdepth 3 -path './*/tests/run-tests.sh' \
              | sed 's|^\./||; s|/tests/run-tests\.sh$||' \
              | sort \
              | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))'
          )"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "matrix: $services"

  mocked-suites:
    name: Mocked suite (${{ matrix.service }})
    needs: discover-suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One job per service rather than `make test` in a single job: they are
      # independent, so this runs them in parallel and reports twenty separate
      # results instead of one. `make test` is the local equivalent.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover-suites.outputs.services) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ./tests/run-tests.sh
        # Mocked mode only. `--live` verifies a real deployment on the host and
        # must never run here. The suites are hermetic by construction: a temp
        # $HOME plus PATH stubs for tailscale/docker/systemctl/curl/sudo, so no
        # network and no host state are touched.
        working-directory: ${{ matrix.service }}
        run: ./tests/run-tests.sh

  python-tests:
    name: Python tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install coverage
        run: python3 -m pip install --upgrade coverage

      - name: make test-python
        # Same target a contributor runs locally. It puts $HOME in a throwaway
        # dir, runs the launcher suite under coverage, and writes coverage.xml
        # with repo-root-relative paths.
        run: make test-python

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # The repo is private and CODECOV_TOKEN may not be set yet. Coverage
          # reporting is a nice-to-have: an unreachable or unconfigured Codecov
          # must not mark a run red when every test passed.
          fail_ci_if_error: false

  python-syntax:
    name: Python syntax (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor launcher/setup.sh enforces at preflight; 3.13 is the
        # newest release. Compiling at both ends catches a file that drifted
        # past the floor (a match statement, a 3.10+ union annotation in a
        # position that is evaluated) or that trips a newer parser.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile every Python file
        run: |
          set -euo pipefail
          find . -name '*.py' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -r python3 -m py_compile
          echo "all .py files compile on $(python3 --version)"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On pull_request events the action lists the PR's commits through the
    # API to scope the scan, which the read-only default token cannot do.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the tip, so it needs all of it.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allowlists, with a reason each, live in .gitleaks.toml. There is no
          # entry for <service>/.env: those are gitignored and never tracked,
          # and if one ever is staged the scan must fail.
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE is only required when the repo belongs to a GitHub
          # organisation. This one is under a personal account, so the action
          # runs without one. Add the secret if the repo is ever transferred.
