# Coolify — self-hosted PaaS (Heroku/Vercel-style deploys) , tailnet-only.
#
# Derived from cdn.coollabs.io/coolify docker-compose.yml +
# docker-compose.prod.yml (Coolify 4.3.21), with these deliberate changes:
#
#   1. Dashboard and Soketi published on 127.0.0.1 only (upstream binds
#      0.0.0.0:8000 / :6001 / :6002). Tailscale Serve terminates TLS.
#      OpenHands already owns :8000 on this box, so the dashboard default
#      is 8101, not 8000.
#   2. Image tags pinned (COOLIFY_VERSION / COOLIFY_REALTIME_VERSION).
#      Upstream floats `latest`; a home-server re-run should not surprise.
#   3. mem_limit on every container. Coolify + Postgres + Redis + Soketi
#      is already a few hundred MiB idle; unbounded PHP-FPM is the thing
#      that OOMs the rest of a 7.7 GB box.
#   4. AUTOUPDATE is off in .env. Coolify's in-app updater rewrites the
#      official compose files under /data/coolify/source and would undo
#      the loopback binds. Upgrade with: bump the versions in .env, then
#      ./setup.sh.
#   5. Named volumes for Postgres/Redis (the image users cannot write a
#      host-owned bind mount without sudo chown). Coolify's own files
#      (ssh keys, app metadata, backups) bind-mount into ~/services/coolify.
#   6. The coolify network is defined here, not `external: true`. Official
#      install.sh creates it first; we do not run that script.
#
# Host-specific values and secrets come from .env, generated by setup.sh
# and never overwritten. Compose auto-loads it from the project directory.
# The Coolify container ALSO takes it as env_file + a read-only bind of
# ./.env → /var/www/html/.env — Laravel reads APP_KEY / DB_* / ROOT_USER_*
# from that file on first boot. That is the official shape, unlike Forgejo
# where .env is interpolation-only.

name: coolify

x-logging: &logging-config
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  coolify:
    container_name: coolify
    image: ${REGISTRY_URL:-docker.io}/coollabsio/coolify:${COOLIFY_VERSION:-4.3.21}
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    logging: *logging-config
    mem_limit: ${COOLIFY_MEM_LIMIT:-768m}
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      PHP_FPM_PM_CONTROL: ${PHP_FPM_PM_CONTROL:-dynamic}
      PHP_FPM_PM_START_SERVERS: ${PHP_FPM_PM_START_SERVERS:-1}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${PHP_FPM_PM_MIN_SPARE_SERVERS:-1}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${PHP_FPM_PM_MAX_SPARE_SERVERS:-5}
    volumes:
      - type: bind
        source: ./.env
        target: /var/www/html/.env
        read_only: true
      - ${COOLIFY_SSH:?COOLIFY_SSH missing from .env}:/var/www/html/storage/app/ssh
      - ${COOLIFY_APPLICATIONS:?COOLIFY_APPLICATIONS missing from .env}:/var/www/html/storage/app/applications
      - ${COOLIFY_DATABASES:?COOLIFY_DATABASES missing from .env}:/var/www/html/storage/app/databases
      - ${COOLIFY_SERVICES:?COOLIFY_SERVICES missing from .env}:/var/www/html/storage/app/services
      - ${COOLIFY_BACKUPS:?COOLIFY_BACKUPS missing from .env}:/var/www/html/storage/app/backups
      - ${COOLIFY_IMAGES:?COOLIFY_IMAGES missing from .env}:/var/www/html/storage/app/images
    ports:
      # loopback only — the tailnet is the security boundary
      - '127.0.0.1:${LOCAL_PORT:-8101}:8080'
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      retries: 24
      start_period: 1m
      timeout: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      soketi:
        condition: service_healthy
    networks:
      - coolify

  postgres:
    container_name: coolify-db
    image: postgres:15-alpine
    restart: always
    logging: *logging-config
    mem_limit: ${COOLIFY_DB_MEM_LIMIT:-256m}
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME missing from .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing from .env}
      POSTGRES_DB: ${DB_DATABASE:-coolify}
    volumes:
      - coolify-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE:-coolify}"]
      interval: 5s
      retries: 10
      timeout: 2s
    networks:
      - coolify

  redis:
    container_name: coolify-redis
    image: redis:7-alpine
    restart: always
    logging: *logging-config
    mem_limit: ${COOLIFY_REDIS_MEM_LIMIT:-128m}
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD missing from .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD missing from .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - coolify-redis:/data
    healthcheck:
      # Official compose pings without auth and then fails once requirepass
      # is set. REDISCLI_AUTH is the supported way to authenticate the probe.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
      timeout: 2s
    networks:
      - coolify

  soketi:
    container_name: coolify-realtime
    image: ${REGISTRY_URL:-docker.io}/coollabsio/coolify-realtime:${COOLIFY_REALTIME_VERSION:-1.0.19}
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
    logging: *logging-config
    mem_limit: ${COOLIFY_SOKETI_MEM_LIMIT:-256m}
    environment:
      APP_NAME: ${APP_NAME:-Coolify}
      SOKETI_DEBUG: ${SOKETI_DEBUG:-false}
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:?PUSHER_APP_ID missing from .env}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:?PUSHER_APP_KEY missing from .env}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:?PUSHER_APP_SECRET missing from .env}
      # In-container listen. Host publish below is loopback-only.
      SOKETI_HOST: ${SOKETI_HOST:-0.0.0.0}
    volumes:
      - ${COOLIFY_SSH:?COOLIFY_SSH missing from .env}:/var/www/html/storage/app/ssh
    ports:
      - '127.0.0.1:${SOKETI_PORT:-6001}:6001'
      - '127.0.0.1:${SOKETI_METRICS_PORT:-6002}:6002'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready && wget -qO- http://127.0.0.1:6002/ready || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s
    networks:
      - coolify

volumes:
  coolify-db:
    name: coolify-db
  coolify-redis:
    name: coolify-redis

networks:
  coolify:
    name: coolify
    driver: bridge
