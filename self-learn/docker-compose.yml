# self-learn — Postgres for the Gnosia catalog, tailnet-only by omission.
#
# Only the database runs in Docker. The Next.js app is a native `next start`
# under a systemd user unit / launchd agent (self-learn.service), because the
# repo ships no Dockerfile and a four-workspace npm build belongs on the host
# toolchain. This mirrors upstream's services/catalog/compose.yaml (which
# documents the same postgres:17-on-127.0.0.1:5432 shape for the homeserver)
# with three changes:
#
#   1. Credentials generated into .env (POSTGRES_PASSWORD), not the upstream
#      file's literal `catalog`. The port is still loopback-only, so the
#      password guards against other local users, not the network.
#   2. PG_PORT is an .env knob. 5432 is free on this box today, but a future
#      host Postgres or a second container claiming it must not break us.
#   3. mem_limit, matching the repo's other Postgres sidecars.
#
# Why the port is published at all (firefly-iii and metabase publish theirs
# nowhere): the catalog CLI runs on the HOST — `npm run catalog` in the
# deploy checkout — and reaches Postgres over TCP. Loopback publish is the
# narrowest bind that allows it; Docker publishes past ufw, so 0.0.0.0 would
# open the database to the LAN.
#
# Host-specific values come from .env, generated by setup.sh and never
# overwritten. Compose interpolates it from the project directory.

name: self-learn

x-logging: &logging-config
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    container_name: self-learn-db
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    restart: always
    logging: *logging-config
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-self_learn}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from .env}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - '127.0.0.1:${PG_PORT:-5432}:5432'
    volumes:
      - self-learn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-catalog} -d ${POSTGRES_DB:-self_learn}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  self-learn-postgres:
