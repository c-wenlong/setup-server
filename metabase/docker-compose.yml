# Metabase OSS — self-hosted BI, tailnet-only.
#
# Derived from www.metabase.com/docs/latest/installation-and-operation/running-metabase-on-docker
# with these changes:
#
#   1. One published port, loopback only. Upstream binds 0.0.0.0:3000.
#      Tailscale Serve terminates TLS, so we publish 127.0.0.1:LOCAL_PORT
#      (default 8104 — forgejo already owns host :3000).
#   2. Image tag pinned (METABASE_VERSION). Upstream floats `latest`.
#   3. Postgres sidecar instead of the image's embedded H2. H2 is the
#      documented "try it" path and is not a backup target.
#   4. mem_limit. Official has none. Metabase is a JVM; 768m OOMs on this
#      box the same way Stirling did.
#   5. restart: always (repo convention).
#   6. MB_SITE_URL is the tailnet HTTPS URL. Without it, password-reset
#      and embed links get whatever Host header arrived first.
#   7. Anonymous usage tracking off.
#
# Host-specific values come from .env, generated by setup.sh and never
# overwritten. Compose interpolates it from the project directory.

name: metabase

x-logging: &logging-config
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  metabase:
    container_name: metabase
    image: metabase/metabase:${METABASE_VERSION:-v0.63.17.3}
    restart: always
    logging: *logging-config
    mem_limit: ${METABASE_MEM_LIMIT:-1536m}
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:-metabase}
      MB_DB_PORT: "5432"
      MB_DB_USER: ${METABASE_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD missing from .env}
      MB_DB_HOST: db
      MB_SITE_URL: ${MB_SITE_URL:?MB_SITE_URL missing from .env}
      MB_SITE_NAME: ${MB_SITE_NAME:-kai-home-server}
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TIMEZONE: ${TZ:-Etc/UTC}
      JAVA_TOOL_OPTIONS: ${METABASE_JAVA_OPTS:--Xmx1g}
    ports:
      - '127.0.0.1:${LOCAL_PORT:-8104}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  db:
    container_name: metabase-db
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: always
    logging: *logging-config
    mem_limit: ${METABASE_DB_MEM_LIMIT:-256m}
    environment:
      POSTGRES_DB: ${METABASE_DB_NAME:-metabase}
      POSTGRES_USER: ${METABASE_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD missing from .env}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - metabase-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${METABASE_DB_USER:-metabase} -d ${METABASE_DB_NAME:-metabase}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  metabase-postgres:
