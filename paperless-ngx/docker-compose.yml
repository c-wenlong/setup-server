# Paperless-ngx — OCR'd, full-text-searchable document archive.
#
# TWO containers, deliberately. Upstream's docker-compose ships five
# (webserver + broker + Postgres + Tika + Gotenberg). This box has 7.7 GB of
# RAM, was already 1.9 GB into swap when this was written, and ollama claims
# ~5 GB the moment a model loads. So:
#
#   webserver  Paperless itself — Django + granian + celery worker + celery
#              beat + the consume-folder watcher, all under s6 in one image.
#              Loopback only, fronted by `tailscale serve`.
#   redis      the celery broker. Reachable ONLY on this compose network.
#              Publishing it would put an unauthenticated Redis on the host.
#
# Differences from the upstream example compose, and why:
#
#   1. SQLite, not Postgres. Dropping PAPERLESS_DBHOST selects SQLite (the
#      engine is named explicitly below anyway). Saves a whole container for
#      a single-user archive. Measured running in WAL mode.
#   2. No Tika, no Gotenberg. They buy Office-document parsing (docx/xlsx/
#      odt) and nothing else; PDFs, images and scans work without them. See
#      the commented opt-in at the bottom, with the RAM cost stated.
#   3. Tags pinned exactly. Upstream floats.
#   4. `mem_limit` on both, sized off the MEASURED OCR peak — not off idle.
#      See the long note on the webserver's limit; this is the one setting
#      here that was got wrong first and cost a silent data-loss bug.
#   5. OCR concurrency pinned to 1. Upstream lets it default, which on this
#      12-core box means twelve parallel tesseract jobs. Also see below.
#
# Host-specific values come from .env, generated by setup.sh and never
# overwritten. Compose auto-loads it from the project directory for
# interpolation. It is deliberately NOT passed as `env_file:` — .env holds
# the Django secret key and the generated admin password, and only the
# handful of variables named explicitly below should reach the container.

name: paperless-ngx

services:
  # ----------------------------------------------------------------- redis
  redis:
    container_name: ${REDIS_CONTAINER_NAME:-paperless-redis}

    # Pinned literally rather than through .env: this is a broker for a
    # queue that is drained within seconds, there is nothing in it worth a
    # version knob, and 7-alpine is a ~4 MiB resident process.
    image: redis:7-alpine

    restart: unless-stopped

    # Measured idle: 4 MiB. 96m is ~20x headroom and still small enough that
    # a runaway broker cannot hurt the box.
    mem_limit: 96m

    # Persistence off, on purpose. Everything in here is a celery task
    # envelope; the documents live in the webserver's volumes. Losing the
    # broker on a restart costs at most one in-flight OCR job, which
    # Paperless re-queues when the file is still sitting in consume/.
    # Turning it off avoids an fsync-heavy writer on a box with one disk,
    # and means there is no redis volume to back up or forget about.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru

    # No ports block at all. This is the point: redis is reachable only by
    # the webserver, over the compose network, by the name `redis`.

  # ------------------------------------------------------------- webserver
  webserver:
    container_name: ${CONTAINER_NAME:-paperless-ngx}

    # Pinned exactly. Do NOT float this tag. Paperless applies database
    # migrations on first start of a newer image and they are one-way: an
    # accidental major bump you want to roll back means restoring
    # ${PAPERLESS_ROOT} from a backup, and there is no backup on this box.
    #
    # 3.1.3 was the version everything in PAPERLESS-DERISK.md was measured
    # against, end to end: boot, migrations, superuser creation, a real OCR
    # ingest, full-text search, and a login through Tailscale Serve.
    #
    # Upgrades: read the release notes, export first
    # (`docker exec <web> document_exporter ../export`), then bump
    # PAPERLESS_VERSION in .env and re-run setup.sh.
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_VERSION:-3.1.3}

    depends_on:
      - redis

    # `unless-stopped`, not `always`. Kai's workflow is to deploy a service,
    # confirm it, then stop it again — and this is the heaviest service on
    # the box, so stopping it is a reasonable default. `always` would bring
    # it back on the next dockerd restart even after a deliberate
    # `docker compose stop`, quietly re-claiming 650 MB.
    restart: unless-stopped

    # ---------------------------------------------------------------------
    # THE MEMORY LIMIT. Read this before changing it — the obvious value is
    # wrong in a way that loses documents silently.
    #
    # Measured on this box against 3.1.3, ingesting a 10-page 300 dpi A4
    # scan (i.e. an ordinary thing to feed a document archive):
    #
    #   idle, no documents ........................ 660 MiB  (630 MiB anon)
    #   OCR, default thread count, limit 1g ....... OOM-KILLED
    #   OCR, 1 thread + the convert cap, 1536m .... ok, 97 s, zero swap
    #
    # The OOM is the dangerous one. Docker's OOM killer took the celery
    # child, not PID 1, so:
    #   * the container stayed `running` and kept reporting `(healthy)`
    #   * the web UI stayed perfectly responsive
    #   * the file stayed sitting in consume/ and NO document appeared
    #   * nothing in `docker ps` or any HTTP health check noticed
    # The symptom is "I scanned it and it never showed up", which nobody
    # connects to a memory limit. `docker inspect -f '{{.State.OOMKilled}}'`
    # is the tell.
    #
    # Sizing a limit off the 660 MiB idle figure is therefore exactly the
    # mistake to avoid. 1536m is sized off the peak, and at that value an
    # intermediate 1g run was also measured pushing 973 MiB of anonymous
    # memory into HOST SWAP rather than OOMing — which is worse than either
    # outcome on a box that was already 1.9 GB into swap, because it slows
    # everything else down instead of failing one job. At 1536m with the
    # concurrency settings below, measured swap use was zero.
    #
    # So the limit is a runaway guard that normal operation never reaches,
    # which is the only kind worth having. If you ingest much larger scans
    # (50+ pages, 600 dpi) and see OOMKilled=true, raise this rather than
    # wondering why documents vanish.
    # ---------------------------------------------------------------------
    mem_limit: 1536m

    volumes:
      # Split by what it costs you to lose it:
      #
      #   data/    db.sqlite3 (every document's metadata, tags,
      #            correspondents, users) plus the tantivy full-text index.
      #            The index is rebuildable from the documents; the database
      #            is not. BACK THIS UP.
      #   media/   the original files and the OCR'd PDF/A archive versions.
      #            This IS the archive. BACK THIS UP.
      #   consume/ the drop folder. Put a PDF or an image here and Paperless
      #            OCRs it and files it. Transient.
      #   export/  where `document_exporter` writes. The backup target.
      #
      # The container's `paperless` user is remapped to this host user's
      # UID/GID (see USERMAP_* below), so everything here stays owned by you
      # — you can drop files into consume/ and tar up media/ without sudo.
      - ${PAPERLESS_ROOT:?PAPERLESS_ROOT missing from .env — run setup.sh}/data:/usr/src/paperless/data
      - ${PAPERLESS_ROOT:?PAPERLESS_ROOT missing from .env — run setup.sh}/media:/usr/src/paperless/media
      - ${PAPERLESS_ROOT:?PAPERLESS_ROOT missing from .env — run setup.sh}/consume:/usr/src/paperless/consume
      - ${PAPERLESS_ROOT:?PAPERLESS_ROOT missing from .env — run setup.sh}/export:/usr/src/paperless/export

    ports:
      # Loopback only, the house rule. Tailscale Serve terminates TLS in
      # front of this and proxies plain HTTP from localhost. Dropping the
      # host-address prefix here — a one-character edit — would publish a
      # document archive on the LAN.
      - "127.0.0.1:${LOCAL_PORT:-8095}:8000"

    environment:
      # --- the reverse proxy, and the single most breakable setting here ---
      # Django compares the browser's Origin header against
      # CSRF_TRUSTED_ORIGINS as an EXACT string, scheme and port included.
      # Serve terminates TLS and proxies plain HTTP with the Host header
      # intact, so Django computes its own "good origin" as http://…:8095
      # while the browser sends https://…:8095. Those differ, so the login
      # POST is allowed only because PAPERLESS_URL puts the https form in
      # the trusted list.
      #
      # Measured with this variable removed and nothing else changed:
      #   GET /                      302   (unchanged)
      #   GET /accounts/login/       200   (unchanged)
      #   GET /api/remote_version/   200   (unchanged)
      #   POST /accounts/login/      403   "CSRF verification failed."
      # Every health check stays green and nobody can log in. curl will not
      # notice by accident, because curl sends no Origin header.
      #
      # It must be the EXTERNAL tailnet HTTPS URL with the port and no
      # trailing slash, written by setup.sh from `tailscale status`. It is
      # not hardcoded because a literal hostname would be wrong on every
      # other machine, and wrong here in a way that only shows up at login.
      #
      # Setting this also appends the hostname to ALLOWED_HOSTS, which is
      # all that is needed. Do NOT add PAPERLESS_ALLOWED_HOSTS: it defaults
      # to ["*"], and narrowing it makes Django append "localhost" but NOT
      # "127.0.0.1", so the browser keeps working while the loopback health
      # check, the Uptime Kuma monitor and the live test suite all start
      # returning 400 Invalid HTTP_HOST header against a healthy app.
      PAPERLESS_URL: ${PAPERLESS_URL}

      # --- database -------------------------------------------------------
      # Named explicitly even though SQLite is what you get by omitting
      # PAPERLESS_DBHOST. Being explicit means a future release changing
      # that default cannot silently point this deployment at a Postgres
      # that does not exist. Paperless runs it in WAL mode with a 5 s busy
      # timeout, which is fine for one user.
      PAPERLESS_DBENGINE: sqlite

      # --- broker ---------------------------------------------------------
      # `redis` is the compose service name, resolved on the internal
      # network. If this is wrong, the web UI works perfectly and nothing is
      # ever OCR'd — the failure is entirely invisible from the front end.
      PAPERLESS_REDIS: redis://redis:6379

      # --- OCR concurrency, which is really a memory setting --------------
      # PAPERLESS_THREADS_PER_WORKER defaults to floor(cores / task_workers).
      # This box has 12 cores and one task worker, so the default is TWELVE
      # parallel tesseract jobs, each holding a 300 dpi page in memory. That
      # default is what OOM-killed the worker at a 1g limit (see mem_limit).
      #
      # Pinning it to 1 made the same 10-page scan finish in 97 s with zero
      # swap, versus 77 s at 2 threads while pushing 337 MiB into swap. A
      # 20-second penalty on a background job is a trade worth taking on a
      # box that is also running immich, seafile and home-assistant.
      PAPERLESS_THREADS_PER_WORKER: "1"

      # One celery worker and one web worker. Both are already the image's
      # defaults; stated so that a future default change cannot quietly
      # multiply the resident set.
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_WEBSERVER_WORKERS: "1"

      # ImageMagick's own memory ceiling, 128 MiB, for the thumbnail and
      # page-render steps. Belt and braces with the setting above: this one
      # makes ImageMagick spill to a temp file instead of growing, which is
      # slower but bounded.
      PAPERLESS_CONVERT_MEMORY_LIMIT: "134217728"

      # --- identity -------------------------------------------------------
      # Django's signing key: sessions, password-reset tokens, share links.
      # Generated by setup.sh. Changing it logs everyone out and invalidates
      # every outstanding share link. The image refuses to start if it is
      # unset or left at the literal "change-me".
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}

      # The superuser, created on first boot only. Measured against this
      # image: `manage_superuser` returns early the moment the username is
      # taken or any superuser exists, and NEVER calls set_password. So a
      # re-run cannot stomp a password changed in the web UI — and, the
      # other side of the same coin, cannot repair one either. Once you
      # change it in the UI the value in .env is stale documentation.
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}

      # --- locale ---------------------------------------------------------
      # PAPERLESS_TIME_ZONE is what dates are rendered and filed in; TZ is
      # what log timestamps use. Setting only one of them produces documents
      # dated a day out around midnight.
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE:-Etc/UTC}
      TZ: ${PAPERLESS_TIME_ZONE:-Etc/UTC}

      # Tesseract language packs to load. `eng` alone keeps the OCR fast and
      # the memory footprint down; add more as `eng+deu` and the image
      # downloads them on next start.
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}

      # --- file ownership -------------------------------------------------
      # Remap the container's `paperless` user onto the deploying host
      # user's UID/GID, resolved by setup.sh. Without this the bind mounts
      # fill up with files owned by a UID you are not, and the single most
      # common Paperless complaint — "I copied a PDF into consume/ and
      # nothing happened" — is a permission error you cannot see.
      USERMAP_UID: ${PAPERLESS_UID:-1000}
      USERMAP_GID: ${PAPERLESS_GID:-1000}

# ---------------------------------------------------------------------------
# OPTIONAL: Office-document parsing (Tika + Gotenberg)
#
# Paperless handles PDFs, images and plain text on its own. It needs these
# two sidecars only to read .docx / .xlsx / .pptx / .odt and to render HTML
# email bodies. They are OFF here purely because of RAM: measured elsewhere
# at roughly 250-350 MB for the pair, which on top of the ~660 MB this
# already uses would make Paperless the largest thing on a 7.7 GB box that
# is also running immich, seafile, home-assistant and ollama.
#
# To turn them on: uncomment the two services below, add these three lines
# to the webserver's `environment:` block above,
#
#     PAPERLESS_TIKA_ENABLED: 1
#     PAPERLESS_TIKA_ENDPOINT: http://tika:9998
#     PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
#
# add `- tika` and `- gotenberg` to its `depends_on:`, then re-run setup.sh.
# Check `free -m` afterwards; if the box is swapping, turn them back off and
# convert Office files to PDF before filing them instead.
#
#   tika:
#     container_name: paperless-tika
#     image: docker.io/apache/tika:3.2.3.0
#     restart: unless-stopped
#     mem_limit: 512m
#
#   gotenberg:
#     container_name: paperless-gotenberg
#     image: docker.io/gotenberg/gotenberg:8.23.2
#     restart: unless-stopped
#     mem_limit: 384m
#     # Gotenberg ships with its own API routes enabled; Paperless only
#     # needs conversion, and upstream disables the rest.
#     command:
#       - "gotenberg"
#       - "--chromium-disable-javascript=true"
#       - "--chromium-allow-list=file:///tmp/.*"
#
# Neither is published to the host in that configuration either — they talk
# to the webserver over the compose network only.
# ---------------------------------------------------------------------------
