# Firefly III — self-hosted double-entry personal finance, tailnet-only.
#
# Three containers:
#   firefly-iii            the web app (nginx + php-fpm), loopback :8097
#   firefly-iii-db         PostgreSQL 16 — the ledger. THIS is the backup target.
#   firefly-iii-importer   the Data Importer, loopback :8099. Deployed but IDLE
#                          until a Firefly personal access token is minted from
#                          a logged-in session (see setup.sh's closing notes).
#
# Differences from the upstream example compose
# (docs.firefly-iii.org/how-to/firefly-iii/installation/docker/):
#
#   1. Both HTTP ports are published on 127.0.0.1 only (upstream binds
#      0.0.0.0). Tailscale Serve terminates TLS in front of them and the
#      tailnet is the security boundary.
#   2. All three image tags are pinned exactly (upstream says `:latest`).
#      This holds financial records; nothing here changes version unattended.
#   3. `mem_limit` on every container. The box is 7.7 GB with immich, seafile,
#      home-assistant, adguard et al already resident and ~2 GB of swap in
#      use; an unbounded php-fpm or postgres is the thing that OOMs the rest.
#   4. `TRUSTED_PROXIES` is `'**'` and `APP_URL` is the EXTERNAL tailnet HTTPS
#      URL. Read the note on those two below — it is the single trap that
#      makes this deploy look successful to curl and broken in a browser.
#   5. `PHP_FPM_PM_MAX_CHILDREN` is cut from the image's 20 to 5. See the note
#      on the app service: 20 workers x a 256M PHP memory_limit is 5 GB of
#      theoretical headroom on a 7.7 GB box that is already swapping.
#   6. No `fireflyiii/cron` container. Recurring transactions and the exchange
#      rate download need a periodic ping; STATIC_CRON_TOKEN is generated so
#      that can be added later without touching the database. See SETUP.md.
#
# Host-specific values and secrets come from .env, generated by setup.sh.
# Compose auto-loads it from the project directory for interpolation. It is
# deliberately NOT passed as env_file to any container — the generated admin
# password lives in that file and must never reach a container's environment.

name: firefly-iii

services:
  app:
    container_name: firefly-iii
    # Pinned to 6.4.2 exactly (PHP 8.4.13). Do NOT float to `latest`: the
    # entrypoint runs `firefly-iii:upgrade-database` on every start and those
    # migrations are one-way. Upgrade deliberately — dump the database first
    # (see SETUP.md), bump FIREFLY_VERSION in .env, then re-run setup.sh.
    image: fireflyiii/core:${FIREFLY_VERSION:-version-6.4.2}
    restart: unless-stopped

    # php-fpm + nginx. Measured idle well under this; the cap exists so a
    # runaway import cannot take the box down with it.
    mem_limit: ${FIREFLY_MEM_LIMIT:-768m}

    environment:
      # --- THE VARIABLE THAT DECIDES WHETHER THE PAGE RENDERS -------------
      #
      # TRUSTED_PROXIES='**' makes Laravel believe Tailscale Serve's
      # X-Forwarded-Proto: https and X-Forwarded-Host headers, and every
      # <link href> and <script src> on the page is built from those.
      #
      # Leave it empty and the failure is invisible to a health check: the
      # login page returns a cheerful 200 over HTTPS with every asset URL
      # written as http://, the browser blocks them all as mixed content, and
      # what you see is an unstyled page with no JavaScript that reads as
      # "Firefly is broken, reinstall it".
      #
      # MEASURED against this exact image, 2026-09-11, four combinations:
      #
      #   TRUSTED_PROXIES  APP_URL              http:// refs on /login
      #   '**'             external https URL   0     <- this deploy
      #   '**'             http://127.0.0.1:…   0
      #   (empty)          external https URL   4     <- broken page
      #   (empty)          http://127.0.0.1:…   4     <- broken page
      #
      # So TRUSTED_PROXIES is the one that decides it; APP_URL does NOT drive
      # asset URLs in 6.4.2 (Laravel derives them from the proxy-corrected
      # request). The last row was confirmed end to end through a real
      # `tailscale serve --https` mount, and setup.sh re-checks it after every
      # deploy by counting src="http:// and href="http:// in the page fetched
      # over the tailnet and requiring zero.
      #
      # The quotes on '**' are load-bearing YAML, not decoration.
      TRUSTED_PROXIES: '**'

      # Still the external URL, and still worth getting right — it is what
      # Firefly puts in the mails it generates and what it validates some
      # requests against. It is simply not what fixes the assets above.
      APP_URL: ${FIREFLY_APP_URL:?FIREFLY_APP_URL missing from .env — it must be the external tailnet HTTPS URL}

      # Exactly 32 characters, no `base64:` prefix (measured: the plain form
      # is what this image accepts). Changing it invalidates every session and
      # every encrypted field. Generated once by setup.sh.
      APP_KEY: ${FIREFLY_APP_KEY:?FIREFLY_APP_KEY missing from .env}

      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOG_LEVEL: notice
      # The audit log records financial events on a separate channel and can
      # contain transaction detail. Off, as upstream ships it.
      AUDIT_LOG_LEVEL: emergency
      LOG_CHANNEL: stack

      # Shown in error pages/mails as "contact this person". Not a login.
      SITE_OWNER: ${FIREFLY_SITE_OWNER:-mail@example.com}
      DEFAULT_LANGUAGE: en_US
      DEFAULT_LOCALE: equal
      TZ: ${TZ:-Etc/UTC}

      # --- database -------------------------------------------------------
      # These four must match the db service's POSTGRES_* exactly. A mismatch
      # does not produce a clean error — the entrypoint's wait-for-it passes
      # (the port is open) and the migrations then hang.
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${FIREFLY_DB_NAME:-firefly}
      DB_USERNAME: ${FIREFLY_DB_USER:-firefly}
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:?FIREFLY_DB_PASSWORD missing from .env}
      PGSQL_SCHEMA: public

      # File-backed. No redis container: this is a single-user ledger and the
      # extra process would cost more RAM than the cache saves.
      CACHE_DRIVER: file
      SESSION_DRIVER: file

      # false ON PURPOSE. Tailscale Serve gives the browser HTTPS, but the
      # container itself is reached over plain HTTP on loopback, and setup.sh
      # creates the admin account through that loopback port. A Secure cookie
      # would never be sent back over http://127.0.0.1, so the CSRF check on
      # the registration POST would fail with HTTP 419 "Page Expired".
      # The tailnet plus Serve's TLS is the confidentiality boundary.
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax

      # No SMTP on this box. `log` means Firefly writes mails it would have
      # sent into its own log instead of failing.
      MAIL_MAILER: log
      MAIL_FROM: ${FIREFLY_SITE_OWNER:-mail@example.com}

      # --- currency -------------------------------------------------------
      # Deliberate deviation from the shipped defaults (both false upstream).
      # This ledger holds SGD, USD, EUR and whatever else the multi-currency
      # wallets carry; a silent 1:1 conversion is the exact failure mode that
      # disqualified other tools during the tool selection. ENABLE_EXTERNAL_RATES
      # fetches rates from the Firefly author's Azure container — the only
      # outbound call this deploy makes. Set FIREFLY_ENABLE_RATES=false in
      # .env and re-run if you would rather it stayed offline; you then have
      # to enter rates by hand.
      ENABLE_EXCHANGE_RATES: ${FIREFLY_ENABLE_RATES:-true}
      ENABLE_EXTERNAL_RATES: ${FIREFLY_ENABLE_RATES:-true}

      # Recurring transactions, bill reminders and the rate download only run
      # when something pings /api/v1/cron/<token>. Nothing does yet — the
      # token is generated so that can be wired up later without a redeploy.
      STATIC_CRON_TOKEN: ${FIREFLY_STATIC_CRON_TOKEN:?FIREFLY_STATIC_CRON_TOKEN missing from .env}

      # Webhooks can POST to arbitrary URLs. Off until something needs them.
      ALLOW_WEBHOOKS: "false"

      # The image's shipped healthcheck is
      # `curl --location --fail http://localhost:8080$HEALTHCHECK_PATH`.
      # Point it at a page that exercises PHP and the database rather than at
      # `/` (a 302 chain) or `/health` (a static 200 that nginx answers even
      # when php-fpm is dead, so it cannot fail). Measured: /login answers 200
      # once a user exists, and 302 -> /register -> 200 before that, both of
      # which --location resolves to a 200.
      HEALTHCHECK_PATH: /login

      # The image ships pm.max_children=20 with a 256M PHP memory_limit —
      # 5 GB of theoretical worst case on a box with ~3.5 GB available and
      # 2 GB of swap already in use. This is a single-user ledger; nginx
      # serves the static assets itself, so five PHP workers is generous.
      # mem_limit above is the hard backstop; this is the thing that stops it
      # being reached in the first place.
      PHP_FPM_PM_MAX_CHILDREN: "5"

    volumes:
      # Attachments and imported files only. Everything else that matters —
      # accounts, transactions, rules, users, and the OAuth signing keys the
      # Data Importer's token depends on — lives in Postgres. The entrypoint
      # re-derives storage/oauth-*.key from the database on every start, which
      # is why this is the only mount the app needs.
      - ${FIREFLY_UPLOAD:?FIREFLY_UPLOAD missing from .env}:/var/www/html/storage/upload
      - /etc/localtime:/etc/localtime:ro

    ports:
      # loopback only — the tailnet is the security boundary. Never 0.0.0.0:
      # this port speaks plain HTTP and carries session cookies for a ledger
      # of every transaction its owner makes.
      - '127.0.0.1:${LOCAL_PORT:-8097}:8080'

    depends_on:
      db:
        # Not just `- db`. The entrypoint's own wait-for-it gives up after 60s
        # and `firefly-iii:create-database` then fails against a database that
        # is still running initdb on a cold first boot.
        condition: service_healthy

  db:
    container_name: firefly-iii-db
    # Stock postgres, pinned to the 16 line. Firefly needs no extensions.
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    mem_limit: ${FIREFLY_DB_MEM_LIMIT:-512m}
    environment:
      POSTGRES_DB: ${FIREFLY_DB_NAME:-firefly}
      POSTGRES_USER: ${FIREFLY_DB_USER:-firefly}
      POSTGRES_PASSWORD: ${FIREFLY_DB_PASSWORD:?FIREFLY_DB_PASSWORD missing from .env}
      # Catches silent disk corruption in a file that is the only copy of the
      # ledger. Costs a few percent of write throughput on a database that
      # will see a few thousand rows a year.
      POSTGRES_INITDB_ARGS: '--data-checksums'
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # THE LEDGER. Every account, transaction, rule, budget and user, plus
      # the Passport keys that sign API tokens. This directory is the backup
      # target — see the backup recipe setup.sh prints. Written by a container
      # that runs as root before dropping to postgres, so it is root-owned on
      # the host and a copy needs sudo (or `docker compose exec db pg_dump`,
      # which is the better recipe anyway).
      - ${FIREFLY_DB_DATA:?FIREFLY_DB_DATA missing from .env}:/var/lib/postgresql/data
    # No `ports:` block, deliberately. Postgres is reachable only from the
    # other containers on this compose project's private network. Nothing on
    # the host — not even loopback — needs to speak to it directly; use
    # `docker compose exec db psql` when you do.
    healthcheck:
      # -U/-d matter: without them pg_isready asks about the `root` user and
      # a database named `root`, and reports the server as not accepting
      # connections while it is perfectly fine.
      test: ['CMD-SHELL', 'pg_isready -U ${FIREFLY_DB_USER:-firefly} -d ${FIREFLY_DB_NAME:-firefly}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  importer:
    container_name: firefly-iii-importer
    # Pinned to 1.9.0 exactly.
    image: fireflyiii/data-importer:${IMPORTER_VERSION:-version-1.9.0}
    restart: unless-stopped
    mem_limit: ${FIREFLY_IMPORTER_MEM_LIMIT:-512m}
    environment:
      # Container-to-container over the compose network. Deliberately NOT the
      # tailnet URL: that would send every import back out through Serve and
      # make the importer depend on TLS and MagicDNS to talk to a process one
      # bridge away. EXPECT_SECURE_URL must stay false for the same reason.
      FIREFLY_III_URL: http://app:8080
      # ...but the links the importer shows YOU have to be clickable in a
      # browser, so they get the external URL instead.
      VANITY_URL: ${FIREFLY_APP_URL:?FIREFLY_APP_URL missing from .env}
      EXPECT_SECURE_URL: "false"

      # EMPTY, and that is the intended end state of this deploy. The token
      # can only be minted from a logged-in Firefly session (Profile -> OAuth
      # -> Personal Access Tokens), so no script can create it. Until then the
      # importer runs and shows you instructions instead of an import form.
      # Paste the token into FIREFLY_ACCESS_TOKEN in .env and re-run setup.sh.
      FIREFLY_III_ACCESS_TOKEN: ${FIREFLY_ACCESS_TOKEN:-}

      # Same reverse-proxy story as the app: without this the importer's own
      # asset URLs come out http:// behind Serve.
      TRUSTED_PROXIES: '**'

      # Used to parse amounts and dates out of CSV files.
      FALLBACK_LOCALE: en_US
      TZ: ${TZ:-Etc/UTC}
      APP_ENV: local
      APP_DEBUG: "false"
      LOG_LEVEL: notice
      # Would dump full request/response JSON — including transaction detail
      # and the access token — into the logs.
      LOG_RETURN_JSON: "false"

      # The unattended-import endpoints. Both stay off: each one accepts a
      # file or a directory path over HTTP guarded only by a shared secret,
      # and nothing here needs them yet. Turning them on is a Phase 2+
      # decision, and it needs AUTO_IMPORT_SECRET set too.
      CAN_POST_AUTOIMPORT: "false"
      CAN_POST_FILES: "false"

      # Same shipped healthcheck as the app. The importer has no /login and
      # no /index (measured: 404); `/` answers 302 to `/token`, which renders
      # 200 with or without a token configured. Point straight at it.
      HEALTHCHECK_PATH: /token

      # Same reasoning as the app service.
      PHP_FPM_PM_MAX_CHILDREN: "5"

    volumes:
      # Saved import configurations (column mappings, account matches). Small,
      # but painful to rebuild by hand — back it up with the database.
      - ${FIREFLY_IMPORTER_CONFIG:?FIREFLY_IMPORTER_CONFIG missing from .env}:/var/www/html/storage/configurations
      - /etc/localtime:/etc/localtime:ro

    ports:
      # loopback only, same reasoning as the app.
      - '127.0.0.1:${IMPORTER_PORT:-8099}:8080'

    depends_on:
      # Only so the importer starts after the app is answering. It degrades
      # gracefully either way — with no token there is nothing for it to do.
      - app
