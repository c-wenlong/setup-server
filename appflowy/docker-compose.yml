# AppFlowy Cloud — self-hosted Notion alternative, tailnet-only.
#
# Derived from github.com/AppFlowy-IO/AppFlowy-Cloud docker-compose.yml
# (the documented production path), with these deliberate changes:
#
#   1. One published port, loopback only. Upstream nginx binds 0.0.0.0:80
#      and :443 with dummy TLS certs. Tailscale Serve terminates TLS, so
#      we listen on 127.0.0.1:LOCAL_PORT (default 8102) mapping to nginx :80.
#   2. No AI container, no search indexer, no pgadmin, no MinIO console,
#      no Portainer. AI wants an OpenAI key this box does not have; search
#      defaults to a 2 GB mmap. Core editing + sync still work.
#   3. Image tags pinned (APPFLOWY_CLOUD_VERSION / GOTRUE_VERSION / …).
#      Upstream floats `latest`.
#   4. mem_limit on every container. Official has none.
#   5. restart: unless-stopped (repo convention), not on-failure.
#   6. Our nginx.conf (no 443, no pgadmin, no /minio console). /minio-api
#      stays — clients need it for presigned uploads.
#
# Host-specific values come from .env, generated by setup.sh and never
# overwritten. Compose interpolates it from the project directory.

name: appflowy

x-logging: &logging-config
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  nginx:
    container_name: appflowy-nginx
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    restart: unless-stopped
    logging: *logging-config
    mem_limit: ${APPFLOWY_NGINX_MEM_LIMIT:-64m}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:${LOCAL_PORT:-8102}:80'
    depends_on:
      appflowy_cloud:
        condition: service_healthy
      gotrue:
        condition: service_healthy
      appflowy_web:
        condition: service_started
      admin_frontend:
        condition: service_started
    networks:
      - appflowy

  postgres:
    container_name: appflowy-postgres
    image: pgvector/pgvector:${PGVECTOR_VERSION:-pg16}
    restart: unless-stopped
    logging: *logging-config
    mem_limit: ${APPFLOWY_DB_MEM_LIMIT:-512m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing from .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing from .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appflowy

  redis:
    container_name: appflowy-redis
    image: redis:${REDIS_VERSION:-7-alpine}
    restart: unless-stopped
    logging: *logging-config
    mem_limit: ${APPFLOWY_REDIS_MEM_LIMIT:-64m}
    command: redis-server --save 20 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - appflowy

  minio:
    container_name: appflowy-minio
    # Docker Hub minio/minio is frozen/source-only (MinIO Inc., late 2025).
    # Same RELEASE tag, still published on quay.io.
    image: quay.io/minio/minio:${MINIO_VERSION:-RELEASE.2024-12-18T13-15-44Z}
    restart: unless-stopped
    logging: *logging-config
    mem_limit: ${APPFLOWY_MINIO_MEM_LIMIT:-256m}
    environment:
      MINIO_ROOT_USER: ${APPFLOWY_S3_ACCESS_KEY:?APPFLOWY_S3_ACCESS_KEY missing from .env}
      MINIO_ROOT_PASSWORD: ${APPFLOWY_S3_SECRET_KEY:?APPFLOWY_S3_SECRET_KEY missing from .env}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s
    volumes:
      - minio_data:/data
    networks:
      - appflowy

  gotrue:
    container_name: appflowy-gotrue
    image: appflowyinc/gotrue:${GOTRUE_VERSION:-0.18.8}
    restart: unless-stopped
    logging: *logging-config
    mem_limit: ${APPFLOWY_GOTRUE_MEM_LIMIT:-128m}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9999/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      GOTRUE_ADMIN_EMAIL: ${GOTRUE_ADMIN_EMAIL:?GOTRUE_ADMIN_EMAIL missing from .env}
      GOTRUE_ADMIN_PASSWORD: ${GOTRUE_ADMIN_PASSWORD:?GOTRUE_ADMIN_PASSWORD missing from .env}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-true}
      GOTRUE_SITE_URL: appflowy-flutter://
      GOTRUE_URI_ALLOW_LIST: "**"
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?GOTRUE_JWT_SECRET missing from .env}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-604800}
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_DB_DRIVER: postgres
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?API_EXTERNAL_URL missing from .env}
      DATABASE_URL: ${GOTRUE_DATABASE_URL:?GOTRUE_DATABASE_URL missing from .env}
      PORT: "9999"
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_MAX_FREQUENCY: ${GOTRUE_SMTP_MAX_FREQUENCY:-1ns}
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${GOTRUE_RATE_LIMIT_EMAIL_SENT:-100}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "false"
      GOTRUE_EXTERNAL_GITHUB_ENABLED: "false"
      GOTRUE_EXTERNAL_DISCORD_ENABLED: "false"
      GOTRUE_SAML_ENABLED: "false"
    networks:
      - appflowy

  appflowy_cloud:
    container_name: appflowy-cloud
    image: appflowyinc/appflowy_cloud:${APPFLOWY_CLOUD_VERSION:-0.18.8}
    restart: unless-stopped
    logging: *logging-config
    mem_limit: ${APPFLOWY_CLOUD_MEM_LIMIT:-512m}
    depends_on:
      gotrue:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_DATABASE_URL: ${APPFLOWY_DATABASE_URL:?APPFLOWY_DATABASE_URL missing from .env}
      APPFLOWY_REDIS_URI: ${APPFLOWY_REDIS_URI:?APPFLOWY_REDIS_URI missing from .env}
      APPFLOWY_GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?}
      APPFLOWY_GOTRUE_BASE_URL: ${APPFLOWY_GOTRUE_BASE_URL:-http://gotrue:9999}
      APPFLOWY_S3_CREATE_BUCKET: ${APPFLOWY_S3_CREATE_BUCKET:-true}
      APPFLOWY_S3_USE_MINIO: ${APPFLOWY_S3_USE_MINIO:-true}
      APPFLOWY_S3_MINIO_URL: ${APPFLOWY_S3_MINIO_URL:-http://minio:9000}
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY:?}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY:?}
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
      APPFLOWY_S3_PRESIGNED_URL_ENDPOINT: ${APPFLOWY_S3_PRESIGNED_URL_ENDPOINT:?APPFLOWY_S3_PRESIGNED_URL_ENDPOINT missing from .env}
      APPFLOWY_ACCESS_CONTROL: ${APPFLOWY_ACCESS_CONTROL:-true}
      APPFLOWY_DATABASE_MAX_CONNECTIONS: ${APPFLOWY_DATABASE_MAX_CONNECTIONS:-10}
      APPFLOWY_WEB_URL: ${APPFLOWY_WEB_URL:?APPFLOWY_WEB_URL missing from .env}
      APPFLOWY_BASE_URL: ${APPFLOWY_BASE_URL:?APPFLOWY_BASE_URL missing from .env}
      AI_ENABLED: ${AI_ENABLED:-false}
      APPFLOWY_SEARCH_SERVICE_URL: ${APPFLOWY_SEARCH_SERVICE_URL:-}
    networks:
      - appflowy

  admin_frontend:
    container_name: appflowy-admin
    image: appflowyinc/admin_frontend:${APPFLOWY_ADMIN_FRONTEND_VERSION:-0.18.1}
    restart: unless-stopped
    logging: *logging-config
    mem_limit: ${APPFLOWY_ADMIN_MEM_LIMIT:-128m}
    depends_on:
      gotrue:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy
    environment:
      APPFLOWY_GOTRUE_BASE_URL: ${APPFLOWY_GOTRUE_BASE_URL:-http://gotrue:9999}
      APPFLOWY_BASE_URL: ${APPFLOWY_BASE_URL:?}
    networks:
      - appflowy

  appflowy_worker:
    container_name: appflowy-worker
    image: appflowyinc/appflowy_worker:${APPFLOWY_WORKER_VERSION:-0.18.8}
    restart: unless-stopped
    logging: *logging-config
    mem_limit: ${APPFLOWY_WORKER_MEM_LIMIT:-256m}
    depends_on:
      postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_WORKER_REDIS_URL: ${APPFLOWY_WORKER_REDIS_URL:-redis://redis:6379}
      APPFLOWY_WORKER_ENVIRONMENT: production
      APPFLOWY_WORKER_DATABASE_URL: ${APPFLOWY_WORKER_DATABASE_URL:?APPFLOWY_WORKER_DATABASE_URL missing from .env}
      APPFLOWY_WORKER_DATABASE_NAME: ${POSTGRES_DB:?}
      APPFLOWY_WORKER_IMPORT_TICK_INTERVAL: "30"
      APPFLOWY_S3_USE_MINIO: ${APPFLOWY_S3_USE_MINIO:-true}
      APPFLOWY_S3_MINIO_URL: ${APPFLOWY_S3_MINIO_URL:-http://minio:9000}
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY:?}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY:?}
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
    networks:
      - appflowy

  appflowy_web:
    container_name: appflowy-web
    image: appflowyinc/appflowy_web:${APPFLOWY_WEB_VERSION:-0.18.4}
    restart: unless-stopped
    logging: *logging-config
    mem_limit: ${APPFLOWY_WEB_MEM_LIMIT:-128m}
    depends_on:
      appflowy_cloud:
        condition: service_healthy
    environment:
      APPFLOWY_BASE_URL: ${APPFLOWY_BASE_URL:?}
      APPFLOWY_GOTRUE_BASE_URL: ${APPFLOWY_BASE_URL}/gotrue
      APPFLOWY_WS_BASE_URL: ${APPFLOWY_WEBSOCKET_BASE_URL:?APPFLOWY_WEBSOCKET_BASE_URL missing from .env}
    networks:
      - appflowy

volumes:
  postgres_data:
    name: appflowy-postgres
  redis_data:
    name: appflowy-redis
  minio_data:
    name: appflowy-minio

networks:
  appflowy:
    name: appflowy
    driver: bridge
