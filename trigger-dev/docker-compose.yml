# Trigger.dev v4 — background jobs and cron, tailnet-only.
#
# Combined webapp + supervisor on one machine, derived from
# github.com/triggerdotdev/trigger.dev hosting/docker (webapp + worker)
# with these deliberate changes for a 7.7 GB home server:
#
#   1. Webapp and registry published on 127.0.0.1 only (upstream webapp
#      binds 0.0.0.0:8030). Tailscale Serve terminates TLS in front of
#      the dashboard. Postgres, Redis, Electric, MinIO and the docker
#      socket proxy are published nowhere.
#   2. s2-lite is omitted (Redis streams v1). ClickHouse is present
#      because v4.6.0 Zod-requires CLICKHOUSE_URL at boot, but events
#      stay in Postgres (EVENT_REPOSITORY_DEFAULT_STORE=postgres) and
#      RUN_REPLICATION_ENABLED=0 so ClickHouse is a boot dependency,
#      not the event store. Official wants 6+8 GB; this box has 7.7 GB.
#   3. mem_limit on every container, a 768 MiB Node heap, concurrency
#      2, and machine presets capped at 0.75 GB. An unbounded webapp
#      would OOM the rest of the box (NODE_MAX_OLD_SPACE_SIZE defaults
#      to 8192).
#   4. Image tag pinned via TRIGGER_IMAGE_TAG (v4.6.0). Do not float
#      to `latest` — CLI and platform versions must match.
#   5. Telemetry off. Sign-up locked to WHITELISTED_EMAILS.
#
# Host-specific values and secrets come from .env, generated by setup.sh
# and never overwritten. Compose interpolates it from the project
# directory; it is deliberately NOT passed as env_file.

name: trigger-dev

x-logging: &logging-config
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  webapp:
    container_name: trigger-webapp
    image: ghcr.io/triggerdotdev/trigger.dev:${TRIGGER_IMAGE_TAG:-v4.6.0}
    restart: always
    logging: *logging-config
    mem_limit: ${WEBAPP_MEM_LIMIT:-1g}
    ports:
      - '127.0.0.1:${LOCAL_PORT:-8030}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - webapp
      - supervisor
    volumes:
      - ${TRIGGER_SHARED:?TRIGGER_SHARED missing from .env}:/home/node/shared
      - ./machine-presets.json:/home/node/machine-presets.json:ro
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec ./scripts/entrypoint.sh"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:3000/healthcheck', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN missing from .env}
      LOGIN_ORIGIN: ${LOGIN_ORIGIN:?LOGIN_ORIGIN missing from .env}
      API_ORIGIN: ${API_ORIGIN:?API_ORIGIN missing from .env}
      ELECTRIC_ORIGIN: http://electric:3000
      REALTIME_STREAMS_DEFAULT_VERSION: v1
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/main?schema=public&sslmode=disable
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/main?schema=public&sslmode=disable
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-5}
      SESSION_SECRET: ${SESSION_SECRET:?}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      PROVIDER_SECRET: ${PROVIDER_SECRET:?}
      COORDINATOR_SECRET: ${COORDINATOR_SECRET:?}
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET:?}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS_DISABLED: "true"
      APP_LOG_LEVEL: info
      DEV_OTEL_EXPORTER_OTLP_ENDPOINT: ${APP_ORIGIN}/otel
      DEPLOY_REGISTRY_HOST: ${DOCKER_REGISTRY_URL:-localhost:5000}
      DEPLOY_REGISTRY_NAMESPACE: ${DOCKER_REGISTRY_NAMESPACE:-trigger}
      DEPLOY_REGISTRY_USERNAME: ${DOCKER_REGISTRY_USERNAME:-registry-user}
      DEPLOY_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD:?}
      OBJECT_STORE_BASE_URL: http://minio:9000
      OBJECT_STORE_BUCKET: packets
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-admin}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?}
      OBJECT_STORE_REGION: us-east-1
      OBJECT_STORE_SERVICE: s3
      GRACEFUL_SHUTDOWN_TIMEOUT: "1000"
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-768}
      TRIGGER_BOOTSTRAP_ENABLED: "1"
      TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME: bootstrap
      TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH: /home/node/shared/worker_token
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:?}@clickhouse:8123?secure=false
      RUN_REPLICATION_ENABLED: "0"
      EVENT_REPOSITORY_DEFAULT_STORE: postgres
      TRIGGER_TELEMETRY_DISABLED: "1"
      WHITELISTED_EMAILS: ${WHITELISTED_EMAILS:?}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?}
      DEFAULT_ENV_EXECUTION_CONCURRENCY_LIMIT: ${DEFAULT_ENV_CONCURRENCY:-2}
      DEFAULT_ORG_EXECUTION_CONCURRENCY_LIMIT: ${DEFAULT_ORG_CONCURRENCY:-6}
      RUN_ENGINE_WORKER_COUNT: "1"
      MACHINE_PRESETS_OVERRIDE_PATH: /home/node/machine-presets.json

  postgres:
    container_name: trigger-postgres
    image: postgres:${POSTGRES_IMAGE_TAG:-14}
    restart: always
    logging: *logging-config
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
    volumes:
      - ${TRIGGER_POSTGRES:?TRIGGER_POSTGRES missing from .env}:/var/lib/postgresql/data
    networks:
      - webapp
    command:
      - -c
      - wal_level=logical
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: main
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: trigger-redis
    image: redis:${REDIS_IMAGE_TAG:-7}
    restart: always
    logging: *logging-config
    mem_limit: ${REDIS_MEM_LIMIT:-64m}
    volumes:
      - ${TRIGGER_REDIS:?TRIGGER_REDIS missing from .env}:/data
    networks:
      - webapp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  electric:
    container_name: trigger-electric
    image: electricsql/electric:${ELECTRIC_IMAGE_TAG:-1.2.4}
    restart: always
    logging: *logging-config
    mem_limit: ${ELECTRIC_MEM_LIMIT:-384m}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webapp
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/main?schema=public&sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"

  minio:
    container_name: trigger-minio
    image: bitnamilegacy/minio:${MINIO_IMAGE_TAG:-latest}
    restart: always
    logging: *logging-config
    mem_limit: ${MINIO_MEM_LIMIT:-384m}
    networks:
      - webapp
    volumes:
      - ${TRIGGER_MINIO:?TRIGGER_MINIO missing from .env}:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID:-admin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY:?}
      MINIO_DEFAULT_BUCKETS: packets
      MINIO_BROWSER: "off"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  clickhouse:
    container_name: trigger-clickhouse
    image: clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG:-26.2}
    restart: always
    logging: *logging-config
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-768m}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ${TRIGGER_CLICKHOUSE:?TRIGGER_CLICKHOUSE missing from .env}:/var/lib/clickhouse
      - ./clickhouse/data-paths.xml:/etc/clickhouse-server/config.d/data-paths.xml:ro
      - ./clickhouse/override.xml:/etc/clickhouse-server/config.d/override.xml:ro
      - ./clickhouse/users-override.xml:/etc/clickhouse-server/users.d/override.xml:ro
    networks:
      - webapp
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--host",
          "localhost",
          "--port",
          "9000",
          "--user",
          "default",
          "--password",
          "${CLICKHOUSE_PASSWORD}",
          "--query",
          "SELECT 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 20s

  registry:
    container_name: trigger-registry
    image: registry:${REGISTRY_IMAGE_TAG:-2}
    restart: always
    logging: *logging-config
    mem_limit: ${REGISTRY_MEM_LIMIT:-64m}
    ports:
      # Host docker (and `npx trigger.dev deploy` on this box) push here.
      # Loopback only — not on the tailnet, not on the LAN.
      - '127.0.0.1:${REGISTRY_PORT:-5000}:5000'
    networks:
      - webapp
    volumes:
      - ${TRIGGER_REGISTRY:?TRIGGER_REGISTRY missing from .env}:/var/lib/registry
      - ${TRIGGER_REGISTRY_AUTH:?TRIGGER_REGISTRY_AUTH missing from .env}:/auth/htpasswd:ro
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd

  supervisor:
    container_name: trigger-supervisor
    image: ghcr.io/triggerdotdev/supervisor:${TRIGGER_IMAGE_TAG:-v4.6.0}
    restart: always
    logging: *logging-config
    mem_limit: ${SUPERVISOR_MEM_LIMIT:-256m}
    depends_on:
      docker-proxy:
        condition: service_healthy
    networks:
      - supervisor
      - docker-proxy
      - webapp
    volumes:
      - ${TRIGGER_SHARED:?}:/home/node/shared
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec /usr/bin/dumb-init -- pnpm run --filter supervisor start"
    environment:
      TRIGGER_WORKER_TOKEN: file:///home/node/shared/worker_token
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET:?}
      TRIGGER_API_URL: http://webapp:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://webapp:3000/otel
      TRIGGER_WORKLOAD_API_DOMAIN: trigger-supervisor
      TRIGGER_WORKLOAD_API_PORT_EXTERNAL: 8020
      ENFORCE_MACHINE_PRESETS: "1"
      TRIGGER_DEQUEUE_INTERVAL_MS: "1000"
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_RUNNER_NETWORKS: trigger-webapp,trigger-supervisor
      DOCKER_REGISTRY_URL: ${DOCKER_REGISTRY_URL:-localhost:5000}
      DOCKER_REGISTRY_USERNAME: ${DOCKER_REGISTRY_USERNAME:-registry-user}
      DOCKER_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD:?}
      DOCKER_AUTOREMOVE_EXITED_CONTAINERS: "1"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:8020/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  docker-proxy:
    container_name: trigger-docker-proxy
    image: tecnativa/docker-socket-proxy:${DOCKER_PROXY_IMAGE_TAG:-v0.5.0}
    restart: always
    logging: *logging-config
    mem_limit: ${DOCKER_PROXY_MEM_LIMIT:-32m}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    environment:
      LOG_LEVEL: info
      POST: "1"
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2375"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  webapp:
    name: trigger-webapp
  supervisor:
    name: trigger-supervisor
  docker-proxy:
    name: trigger-docker-proxy
