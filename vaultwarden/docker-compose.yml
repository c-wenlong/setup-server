# Vaultwarden — self-hosted Bitwarden-compatible password vault, tailnet-only.
#
# This container holds every password its owner has. The defaults below are
# chosen to keep the attack surface as close to zero as a running service can
# be; read the notes before changing any of them.
#
# Differences from the upstream example compose
# (github.com/dani-garcia/vaultwarden wiki, "Starting a container"):
#
#   1. The HTTP port is published on 127.0.0.1 only (upstream binds
#      0.0.0.0:80). Tailscale Serve terminates TLS in front of it, and the
#      tailnet is the outer auth boundary — the vault's own master-password
#      login is the inner one.
#   2. The image tag is pinned exactly (upstream says `:latest`). A password
#      vault is the last thing that should silently change version under you.
#   3. No ADMIN_TOKEN, so the /admin panel stays disabled (see below).
#   4. SIGNUPS_ALLOWED is not hardcoded — setup.sh drives it through its
#      lifecycle: open on first deploy so the owner can register, then closed
#      automatically on the next run once an account exists.
#
# Host-specific values come from .env, generated by setup.sh. Compose
# auto-loads it from the project directory for interpolation; it is
# deliberately NOT passed as env_file. There is no secret in it — Vaultwarden
# has no server-side admin password to generate, because the master password
# is only ever known to the client.

name: vaultwarden

services:
  vaultwarden:
    container_name: vaultwarden
    # Pinned exactly to 1.37.2 (ships web-vault 2026.7.0). Do NOT float to
    # `latest`: an unattended jump can migrate the SQLite schema in a way that
    # cannot be rolled back, and the thing at risk is every password you own.
    # Upgrade deliberately: back up ${VAULTWARDEN_DATA} first, bump
    # VAULTWARDEN_VERSION in .env, then re-run setup.sh.
    image: vaultwarden/server:${VAULTWARDEN_VERSION:-1.37.2}
    restart: always
    # No `user:` override. This image's entrypoint expects to be root — it is
    # the documented way to run it, and Rocket binds :80 inside the container.
    # Consequence to remember: everything under ${VAULTWARDEN_DATA} ends up
    # root-owned, so backing it up or deleting it from the host needs sudo.
    environment:
      # --- public identity ------------------------------------------------
      # MUST be the full public URL, scheme and port included, exactly as the
      # browser sees it. Vaultwarden derives the WebAuthn/passkey relying-party
      # ID, U2F app-id, attachment links and every emailed link from it. A
      # wrong DOMAIN does not error: 2FA registration just fails later with a
      # browser-side message that blames the key, not the server. setup.sh
      # resolves it from `tailscale status --json` and warns when it drifts.
      DOMAIN: ${VAULTWARDEN_DOMAIN:?VAULTWARDEN_DOMAIN missing from .env}

      # --- who may create an account --------------------------------------
      # The self-closing door. setup.sh writes `true` on the first deploy so
      # the owner can register in the browser (the master password derives the
      # vault key client-side, so no script can create the account for you),
      # then flips this to `false` on the next run once it sees a user in the
      # database. Default here is `false`: if .env is ever lost or truncated,
      # fail CLOSED rather than reopening registration to the whole tailnet.
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}

      # Org invitations bypass SIGNUPS_ALLOWED: with this on, anyone invited
      # to an organisation can create an account even after signups close.
      # This is a single-owner vault, so leave it off — it is the only other
      # door into a closed instance.
      INVITATIONS_ALLOWED: ${VAULTWARDEN_INVITATIONS_ALLOWED:-false}

      # No SMTP is configured on this box. If signup email verification were
      # on, registration would hand out a "check your email" wall for a mail
      # that can never arrive — locking you out of the account you just made.
      SIGNUPS_VERIFY: "false"

      # Password hints are served to *unauthenticated* callers who know an
      # email address. Off: a hint is a free clue about the one password that
      # protects everything else.
      SHOW_PASSWORD_HINT: "false"

      TZ: ${TZ:-Etc/UTC}

      # --- admin panel: deliberately ABSENT --------------------------------
      # There is no ADMIN_TOKEN here on purpose. Without it /admin serves a
      # static "admin panel is disabled" notice and both /admin/users and
      # POST /admin return 404 — verified against this exact image. The panel
      # can delete users and read instance settings, so it stays off.
      #
      # To enable it later (interactive, needs a TTY — `vaultwarden hash`
      # panics without one, which is why setup.sh cannot do this for you):
      #   docker run -it --rm vaultwarden/server:1.37.2 \
      #     /vaultwarden hash --preset owasp
      # Paste the resulting $argon2id$... string into .env as
      #   VAULTWARDEN_ADMIN_TOKEN='<the whole PHC string, single-quoted>'
      # add `ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?}` to this block, and
      # re-run setup.sh. Remove it again when you are done.
    volumes:
      # The entire vault: db.sqlite3 (accounts, encrypted ciphers, org keys),
      # rsa_key.pem (signs login tokens), attachments/ and sends/. Losing this
      # directory loses every password. See the backup notes setup.sh prints.
      - ${VAULTWARDEN_DATA:?VAULTWARDEN_DATA missing from .env}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      # loopback only — the tailnet is the security boundary. Never 0.0.0.0:
      # this port speaks plain HTTP, and on 0.0.0.0 the whole LAN could reach
      # the login form (and any captured session token) unencrypted.
      - '127.0.0.1:${LOCAL_PORT:-8222}:80'
    # No healthcheck block: setup.sh polls GET /alive after every deploy, and
    # a compose-level check would have to assume an HTTP client exists inside
    # the image. `docker ps` shows whatever healthcheck the image itself ships.
