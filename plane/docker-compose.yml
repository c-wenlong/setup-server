# Plane Community — self-hosted Linear/Jira alternative, tailnet-only.
#
# Derived from makeplane/plane v1.4.2 docker-compose.yml (the Community
# release asset), with these changes:
#
#   1. One published port, loopback only. Upstream publishes 0.0.0.0:80
#      and :443. Tailscale Serve terminates TLS, so we publish
#      127.0.0.1:LOCAL_PORT (default 8105) mapping to proxy :80 and omit
#      443 entirely.
#   2. Image tag pinned (APP_RELEASE=v1.4.2). Upstream floats `stable`.
#   3. restart: always at service level. Official puts restart_policy
#      under `deploy`, which Compose on a non-swarm host ignores.
#   4. mem_limit on every container. Official has none. This is eleven
#      processes; unbounded they will OOM the rest of the box.
#   5. MinIO from quay.io, not Docker Hub — Hub's minio/minio is frozen.
#   6. SITE_ADDRESS=:80 so the proxy does not try to mint a Let's Encrypt
#      cert (Serve already has TLS).
#   7. Postgres healthcheck + api waits on migrator completing.
#   8. RabbitMQ management port unpublished. MinIO console unpublished.
#
# Host-specific values come from .env, generated by setup.sh and never
# overwritten. Compose interpolates it from the project directory.

name: plane

x-logging: &logging-config
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from .env}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID missing from .env}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY missing from .env}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID missing from .env}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY missing from .env}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  LISTEN_HTTP_PORT: "80"
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD missing from .env}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY missing from .env}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:?WEB_URL missing from .env}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS missing from .env}
  GUNICORN_WORKERS: "1"
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL missing from .env}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY missing from .env}
  AMQP_URL: ${AMQP_URL:?AMQP_URL missing from .env}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY missing from .env}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

services:
  web:
    container_name: plane-web
    image: makeplane/plane-frontend:${APP_RELEASE:-v1.4.2}
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_WEB_MEM_LIMIT:-256m}
    depends_on:
      - api
      - worker

  space:
    container_name: plane-space
    image: makeplane/plane-space:${APP_RELEASE:-v1.4.2}
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_SPACE_MEM_LIMIT:-256m}
    depends_on:
      - api
      - worker
      - web

  admin:
    container_name: plane-admin
    image: makeplane/plane-admin:${APP_RELEASE:-v1.4.2}
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_ADMIN_MEM_LIMIT:-256m}
    depends_on:
      - api
      - web

  live:
    container_name: plane-live
    image: makeplane/plane-live:${APP_RELEASE:-v1.4.2}
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_LIVE_MEM_LIMIT:-256m}
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      - api
      - web

  api:
    container_name: plane-api
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    command: ./bin/docker-entrypoint-api.sh
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_API_MEM_LIMIT:-768m}
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started

  worker:
    container_name: plane-worker
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    command: ./bin/docker-entrypoint-worker.sh
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_WORKER_MEM_LIMIT:-512m}
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    container_name: plane-beat-worker
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    command: ./bin/docker-entrypoint-beat.sh
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_BEAT_MEM_LIMIT:-128m}
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  migrator:
    container_name: plane-migrator
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    command: ./bin/docker-entrypoint-migrator.sh
    restart: on-failure
    logging: *logging-config
    mem_limit: ${PLANE_MIGRATOR_MEM_LIMIT:-512m}
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started

  plane-db:
    container_name: plane-db
    image: postgres:${POSTGRES_VERSION:-15.7-alpine}
    command: postgres -c 'max_connections=200'
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_DB_MEM_LIMIT:-512m}
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:${VALKEY_VERSION:-7.2.11-alpine}
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_REDIS_MEM_LIMIT:-128m}
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:${RABBITMQ_VERSION:-3.13.6-alpine}
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_MQ_MEM_LIMIT:-256m}
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    # Docker Hub froze minio/minio. Same image, quay.io.
    image: quay.io/minio/minio:${MINIO_VERSION:-RELEASE.2024-12-18T13-15-44Z}
    command: server /export --console-address ":9090"
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_MINIO_MEM_LIMIT:-256m}
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  proxy:
    container_name: plane-proxy
    image: makeplane/plane-proxy:${APP_RELEASE:-v1.4.2}
    restart: always
    logging: *logging-config
    mem_limit: ${PLANE_PROXY_MEM_LIMIT:-64m}
    environment:
      <<: *proxy-env
    ports:
      - '127.0.0.1:${LOCAL_PORT:-8105}:80'
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live

volumes:
  pgdata:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
