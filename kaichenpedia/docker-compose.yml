services:
  kaichenpedia:
    image: nginx:stable-alpine
    container_name: kaichenpedia
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8091}:80"
    volumes:
      # Parent dir is mounted (not www/current itself) so deploy.sh's
      # next -> current swap is visible to the running container.
      - ${SERVICE_HOME}/www:/usr/share/nginx/html:ro
      - ${SERVICE_HOME}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
