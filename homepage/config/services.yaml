---
# Homepage — services.yaml
#
# Seeded once by setup.sh from launcher/services.json, which is the box's real
# service registry. setup.sh NEVER overwrites this file on a re-run, so edit it
# freely; changes are picked up on the next page load with no restart (measured
# against v1.4.5 — the file is re-read per API request).
#
# href        the tailnet URL the tile opens. Substituted at deploy time:
#             __TS_HOST__ becomes this node's MagicDNS name.
# siteMonitor Homepage fetches this itself and shows the HTTP status as the
#             tile's status dot. It runs on the HOST network namespace
#             (see docker-compose.yml), which is the only reason 127.0.0.1
#             URLs work here — every service on this box binds loopback only,
#             and a bridge-network container cannot reach any of them.
#             Redirects ARE followed (measured: a 302 root shows as 200), so
#             these are the same health paths launcher/services.json uses.
#
# A service that is deliberately stopped shows an error status. That is
# correct, not a fault — several of these are start-on-demand.
#
# Icons come from the dashboard-icons CDN and are fetched by YOUR BROWSER,
# not by this box. If you would rather the dashboard make no outbound
# requests at all, replace each `icon:` with an `mdi-` name (bundled) or drop
# the line.

- Daily:
    - Immich:
        icon: immich.png
        href: https://__TS_HOST__:2283/
        description: Photos — timeline, albums, phone backup
        siteMonitor: http://127.0.0.1:2283/api/server/ping

