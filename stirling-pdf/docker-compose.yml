# Stirling PDF — locally hosted PDF toolbox, tailnet-only.
#
# Derived from docs.stirlingpdf.com Docker install, with these changes:
#
#   1. One published port, loopback only. Upstream binds 0.0.0.0:8080.
#      Tailscale Serve terminates TLS, so we publish 127.0.0.1:LOCAL_PORT
#      (default 8103 — code-server already owns host :8080).
#   2. Image tag pinned (STIRLING_PDF_VERSION). Upstream floats `latest`.
#   3. Login OFF. Upstream defaults to a well-known admin/stirling pair.
#      The tailnet is the access boundary; do not re-enable login without
#      changing that password first.
#   4. No Google visibility, no in-app survey, metrics off.
#   5. mem_limit. Official has none. Java PDF tools spike; 768m is the cap.
#   6. restart: always (repo convention).
#
# Host-specific values come from .env, generated by setup.sh and never
# overwritten. Compose interpolates it from the project directory.

name: stirling-pdf

services:
  stirling-pdf:
    container_name: stirling-pdf
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:${STIRLING_PDF_VERSION:-2.14.3}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: ${STIRLING_MEM_LIMIT:-1536m}
    environment:
      PUID: ${STIRLING_UID:-1000}
      PGID: ${STIRLING_GID:-1000}
      TZ: ${TZ:-Etc/UTC}
      # Opt out of the well-known admin/stirling default. The tailnet is
      # the auth boundary. Flip to true only after setting
      # SECURITY_INITIALLOGIN_* in .env.
      SECURITY_ENABLELOGIN: ${SECURITY_ENABLELOGIN:-false}
      SYSTEM_DEFAULTLOCALE: ${SYSTEM_DEFAULTLOCALE:-en-US}
      SYSTEM_GOOGLEVISIBILITY: "false"
      SHOW_SURVEY: "false"
      METRICS_ENABLED: "false"
      SYSTEM_MAXFILESIZE: ${SYSTEM_MAXFILESIZE:-100}
      SYSTEM_FRONTENDURL: ${SYSTEM_FRONTENDURL:?SYSTEM_FRONTENDURL missing from .env}
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - ${STIRLING_DATA:?STIRLING_DATA missing from .env}/configs:/configs
      - ${STIRLING_DATA:?}/logs:/logs
      - ${STIRLING_DATA:?}/tessdata:/usr/share/tessdata
      - ${STIRLING_DATA:?}/pipeline:/pipeline
      - ${STIRLING_DATA:?}/customFiles:/customFiles
    ports:
      - '127.0.0.1:${LOCAL_PORT:-8103}:8080'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/v1/info/status | grep -q UP"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
