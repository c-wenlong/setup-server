# Umami — self-hosted web analytics, tailnet-only.
#
# Derived from github.com/umami-software/umami docker-compose.yml, with
# these changes:
#
#   1. One published port, loopback only. Upstream binds 0.0.0.0:3000.
#      Tailscale Serve terminates TLS, so we publish 127.0.0.1:LOCAL_PORT
#      (default 8106 — forgejo already owns host :3000).
#   2. Image tag pinned (UMAMI_VERSION). Upstream floats
#      `postgresql-latest`. v3 is Postgres-only.
#   3. mem_limit. Official has none.
#   4. restart: always (repo convention).
#   5. Telemetry off. APP_SECRET and TWO_FACTOR_ENCRYPTION_KEY generated
#      by setup.sh. Default admin/umami password is rotated on first boot.
#
# Host-specific values come from .env, generated by setup.sh and never
# overwritten. Compose interpolates it from the project directory.

name: umami

x-logging: &logging-config
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  umami:
    container_name: umami
    image: ghcr.io/umami-software/umami:${UMAMI_VERSION:-3.3.1}
    restart: always
    logging: *logging-config
    mem_limit: ${UMAMI_MEM_LIMIT:-512m}
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD missing from .env}@db:5432/${UMAMI_DB_NAME:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET missing from .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_KEY:?UMAMI_TWO_FACTOR_KEY missing from .env}
      DISABLE_TELEMETRY: "1"
      CLIENT_IP_HEADER: x-forwarded-for
      TRACKER_WEBSITE_ID_HEADER: ""
      HOSTNAME: "0.0.0.0"
    ports:
      - '127.0.0.1:${LOCAL_PORT:-8106}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  db:
    container_name: umami-db
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: always
    logging: *logging-config
    mem_limit: ${UMAMI_DB_MEM_LIMIT:-256m}
    environment:
      POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD missing from .env}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - umami-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  umami-postgres:
