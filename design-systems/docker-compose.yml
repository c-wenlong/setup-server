services:
  design-systems:
    image: nginx:stable-alpine
    container_name: design-systems
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8108}:80"
    volumes:
      # Parent dir is mounted (not www/current itself) so deploy.sh's
      # next -> current swap is visible to the running container.
      - ${SERVICE_HOME}/www:/usr/share/nginx/html:ro
      - ${SERVICE_HOME}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The checkout, read-only, for the repo paths nginx answers
      # (/systems/, /tools/, /example/, /catalog.json, /README.md) — the
      # same allowlist the repo's `make serve` answers. The ~300 MB of
      # LFS screenshots stay in the clone instead of being copied into
      # every release.
      - ${SOURCE_REPO}:/srv/repo:ro
