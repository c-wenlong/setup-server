# AppFlowy Cloud reverse proxy — HTTP only.
#
# Upstream nginx.conf also listens on 443 with bundled dummy certs. Tailscale
# Serve terminates TLS in front of this container, so we bind :80 inside the
# container and publish 127.0.0.1:LOCAL_PORT on the host. No pgadmin, no
# MinIO console: those would be extra surfaces on the tailnet for no gain.
# /minio-api stays — clients need it for presigned uploads.

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    client_max_body_size 10M;
    underscores_in_headers on;

    set $appflowy_cloud_backend "http://appflowy_cloud:8000";
    set $gotrue_backend "http://gotrue:9999";
    set $admin_frontend_backend "http://admin_frontend:3000";
    set $appflowy_web_backend "http://appflowy_web:80";
    set $minio_api_backend "http://minio:9000";
    set $minio_internal_host "minio:9000";

    location /gotrue/ {
      proxy_pass $gotrue_backend;
      rewrite ^/gotrue(/.*)$ $1 break;
      proxy_set_header Host $http_host;
      proxy_pass_request_headers on;
    }

    location /ws {
      proxy_pass $appflowy_cloud_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
    }

    location /api {
      proxy_pass $appflowy_cloud_backend;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Host $http_host;

      location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {
        proxy_pass $appflowy_cloud_backend;
        proxy_request_buffering off;
        client_max_body_size 256M;
      }

      location /api/chat {
        proxy_pass $appflowy_cloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
      }

      location /api/import {
        proxy_pass $appflowy_cloud_backend;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 2G;
      }
    }

    location /minio-api/ {
      proxy_pass $minio_api_backend;
      proxy_set_header Host $minio_internal_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/minio-api/(.*) /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      client_max_body_size 0;
    }

    location /console {
      proxy_pass $admin_frontend_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      proxy_pass $appflowy_web_backend;
      proxy_set_header X-Scheme $scheme;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
