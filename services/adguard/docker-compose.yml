# AdGuard Home — tailnet-wide DNS ad/tracker blocking.
#
# One container that does two jobs, published two different ways:
#
#   web UI   127.0.0.1:${LOCAL_PORT} -> container :3000, fronted by
#            `tailscale serve --https=3080`, exactly like every other service
#            in this repo.
#   resolver ${ADGUARD_DNS_IP}:53 tcp+udp -> container :53, published
#            DIRECTLY on the Tailscale interface. See the long note on the
#            ports block — this is a deliberate exception, not an oversight.
#
# Differences from the upstream example compose
# (github.com/AdguardTeam/AdGuardHome, "Docker"):
#
#   1. Upstream publishes `53:53` and `3000:3000` — i.e. 0.0.0.0, the whole
#      LAN. Here the web UI is loopback-only and DNS is bound to the tailnet
#      address only. Nothing off-tailnet can reach either.
#   2. The image tag is pinned exactly (upstream says `:latest`). Measured
#      against v0.107.79 / config schema_version 34; a schema bump is a
#      one-way migration of the config file.
#   3. The web UI is on 3080, not AdGuard's default 3000 — 3000 on this box
#      is forgejo.
#   4. No first-run wizard is left sitting there: setup.sh drives the install
#      API (POST /control/install/configure) right after the container comes
#      up, which is also what starts the DNS server (see below).
#
# Host-specific values come from .env, generated by setup.sh and never
# overwritten. Compose auto-loads it from the project directory for
# interpolation; it is deliberately NOT passed as env_file, so the generated
# admin password never lands in the container's environment.
#
# THE THING TO KNOW ABOUT THIS CONTAINER: on first launch AdGuard runs *no
# DNS server at all* — only the install wizard. The Docker publish below
# still makes `ss` show ${ADGUARD_DNS_IP}:53 as LISTEN, so a health check
# that looks for a listener passes against a resolver that answers every
# query with "connection refused". setup.sh verifies by resolving a real
# name. Do not replace that with a socket check.

name: adguard

services:
  adguard:
    container_name: adguard
    # Pinned exactly to v0.107.79. Do NOT float to `latest`: AdGuard rewrites
    # AdGuardHome.yaml to the new schema_version on first start of a newer
    # binary, and that is not reversible — an accidental upgrade you want to
    # roll back means restoring ${ADGUARD_CONF} from a backup.
    image: adguard/adguardhome:${ADGUARD_VERSION:-v0.107.79}

    # `unless-stopped`, not `always`, and it is load-bearing here rather than
    # cosmetic: the DNS ports below bind to a SPECIFIC address, and a bind to
    # ${ADGUARD_DNS_IP} fails outright while `tailscale0` does not exist yet.
    # dockerd can and does start before tailscaled after a reboot, so the
    # first attempt may legitimately fail. The restart policy turns that into
    # a couple of retries instead of a dead resolver — which, since this box
    # would by then be the tailnet's nameserver, would take DNS down for
    # every device on it. A restart or two right after a reboot is expected,
    # not a fault.
    restart: unless-stopped

    environment:
      # Only affects log timestamps and the query-log / statistics day
      # boundaries. Everything else AdGuard needs lives in its own config.
      TZ: ${TZ:-Etc/UTC}

    volumes:
      # Two directories, and they are not interchangeable:
      #   conf/ holds AdGuardHome.yaml — the ENTIRE configuration, including
      #         the bcrypt hash of the admin password, the upstream servers,
      #         and the filter list subscriptions. This is the one to back up.
      #   work/ holds the downloaded filter lists (~4 MB, re-downloadable),
      #         the query log and the statistics DB. Losing it costs you
      #         history, not configuration.
      #
      # Both are created 0700 by setup.sh. AdGuard permchecks them on every
      # start and logs `permcheck: warning: found unexpected permissions
      # type=directory path=/opt/adguardhome/work perm=0775 want=0700` if
      # they are looser — verified: at 0700 the warning does not appear.
      #
      # The container runs as root, so the files INSIDE these directories end
      # up root-owned on the host. Deleting or tarring them needs sudo.
      - ${ADGUARD_WORK:?ADGUARD_WORK missing from .env}:/opt/adguardhome/work
      - ${ADGUARD_CONF:?ADGUARD_CONF missing from .env}:/opt/adguardhome/conf
      - /etc/localtime:/etc/localtime:ro

    ports:
      # --- web UI: loopback only, the house rule ------------------------
      # Plain HTTP; Tailscale Serve terminates TLS in front of it. Never
      # 0.0.0.0 — this port serves a login form and, once you are past it,
      # every DNS query every device on the tailnet has made.
      - '127.0.0.1:${LOCAL_PORT:-3080}:3000/tcp'

      # --- DNS: bound to the Tailscale address, and here is why ---------
      # Every other service in this repo binds 127.0.0.1 and is published by
      # `tailscale serve`. A resolver cannot work that way:
      #
      #   * Serve proxies HTTP(S) (and raw TCP), not UDP. DNS is UDP first.
      #   * Tailscale's "Nameservers" setting hands clients a bare IP to
      #     query. That IP has to be this machine's tailnet address, and
      #     something has to be listening on :53 there.
      #
      # So this is the one deliberate exception to the loopback-only rule.
      # It still satisfies the spirit of it: tailscale0 is not the LAN and
      # not the internet — only devices already authenticated onto this
      # tailnet can send a packet to ${ADGUARD_DNS_IP}. The live test
      # suite's `no_external_listener` check allows loopback *plus* the
      # Tailscale addresses, which is exactly this case.
      #
      # ${ADGUARD_DNS_IP} is resolved from `tailscale ip -4` by setup.sh and
      # written into .env. It is NOT hardcoded here on purpose: a literal
      # would be wrong on any other machine, and would silently bind the
      # wrong interface (or fail to start) if this node's tailnet IP ever
      # changed. If the container fails to start with "cannot assign
      # requested address", that value has drifted — re-run setup.sh.
      #
      # Both protocols are required. UDP carries the ordinary queries; TCP
      # carries anything whose answer does not fit (large DNSSEC responses,
      # and any client that retries over TCP after a truncated reply).
      # Publishing only UDP produces a resolver that works until it doesn't.
      - '${ADGUARD_DNS_IP:?ADGUARD_DNS_IP missing from .env — run setup.sh}:53:53/tcp'
      - '${ADGUARD_DNS_IP:?ADGUARD_DNS_IP missing from .env — run setup.sh}:53:53/udp'

    # No healthcheck block, deliberately. The only check worth running here
    # is "does a real query resolve", and a compose healthcheck cannot do
    # that: the image ships no dig/nslookup, and every HTTP-shaped check
    # would go green against a container that is serving the install wizard
    # and running no DNS server at all. setup.sh does the real verification
    # after every deploy; `docker ps` shows whatever the image itself ships.
