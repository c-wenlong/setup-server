# Home Assistant — self-hosted home automation hub, tailnet-only.
#
# Differences from the upstream example compose
# (home-assistant.io/installation/linux, "Docker Compose"):
#
#   1. The image tag is pinned exactly. Upstream says `:stable`, which moves
#      every month and ships breaking changes in point releases — an
#      automation hub that rewrites its own config schema unattended is not
#      something to discover after the fact.
#   2. `privileged: true` is NOT set. Upstream sets it so HA can reach USB
#      radios and the host's Bluetooth stack. Nothing in this deploy needs it
#      yet: Bluetooth is deliberately not loaded (see configuration.yaml), and
#      no Zigbee/Z-Wave stick is attached. Add a targeted `devices:` entry when
#      one is — that is a smaller grant than privileged.
#   3. No /run/dbus mount, for the same reason.
#   4. There is no `ports:` block, and that is not an oversight — see below.
#
# Host-specific values and secrets come from .env, generated by setup.sh.
# Compose auto-loads it from the project directory for interpolation; it is
# deliberately NOT passed as env_file, so the generated admin password never
# ends up in the container's environment.

name: home-assistant

services:
  homeassistant:
    container_name: home-assistant
    # Pinned to 2026.9.1 exactly. Bump deliberately: back up ${HA_CONFIG}
    # first, read the release notes for that month (HA lists breaking changes
    # per release), then set HA_VERSION in .env and re-run setup.sh. Downgrades
    # are not supported once .storage has been migrated.
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-2026.9.1}
    restart: unless-stopped

    # THE ONE THAT NEEDS EXPLAINING.
    #
    # Host networking gives the container the host's entire network namespace.
    # That is a real privilege increase over bridge mode and it is accepted on
    # purpose: zeroconf/mDNS, SSDP and passive DHCP discovery all depend on
    # broadcast and multicast traffic that does not cross a Docker bridge, and
    # finding the things on your LAN is the whole reason to run Home Assistant.
    # It is also what upstream documents.
    #
    # It does NOT mean the service is exposed. `http.server_host: 127.0.0.1` in
    # configuration.yaml makes HA bind loopback and nothing else — measured:
    # `ss -ltn` shows 127.0.0.1:8123 (plus tailscaled's own TLS listener on the
    # tailnet addresses, once Serve is up) and the LAN address refuses the
    # connection. Tailscale Serve is the only way in. The two settings are a
    # pair; changing either one alone breaks the other's assumption, and
    # setup.sh re-checks the actual kernel listener list after every deploy.
    #
    # The catch, and the reason configuration.yaml is shorter than upstream's:
    # host networking also promotes any port an HA SUBPROCESS opens to the
    # host. `go2rtc` (the WebRTC camera streamer that `default_config` pulls
    # in) binds :::18555 on every interface, and HA gives no way to move it.
    # It is left out of configuration.yaml for exactly that reason — see the
    # note there before adding it back.
    network_mode: host

    # No `ports:` block — Compose rejects one alongside network_mode: host, and
    # it would do nothing anyway. The listen address and port are set in
    # configuration.yaml (http.server_host / http.server_port), which is where
    # HA reads them from. To move the port, edit that file and re-run setup.sh
    # with a matching LOCAL_PORT.

    # No `user:` override. This image expects to start as root: it writes
    # /config as root and several integrations assume it. Consequence to
    # remember — everything under ${HA_CONFIG} ends up root-owned, so backing
    # it up or deleting it from the host needs sudo. setup.sh writes
    # configuration.yaml before the first start, while the directory is still
    # yours, which is why that one file stays user-owned and editable.

    environment:
      # Belt and braces with /etc/localtime below. The authority for HA's own
      # clock is `homeassistant.time_zone` in configuration.yaml; this is what
      # the container's libc and any subprocess (ffmpeg) see.
      TZ: ${TZ:-Etc/UTC}

    volumes:
      # EVERYTHING. configuration.yaml, .storage (config entries, the user
      # registry, every device and entity you ever adopt), automations,
      # home-assistant_v2.db (the recorder history) and the logs. This
      # directory IS the installation — it is the only backup target.
      - ${HA_CONFIG:?HA_CONFIG missing from .env}:/config
      - /etc/localtime:/etc/localtime:ro

    # No healthcheck block. The image ships none, and a compose-level one would
    # have to assume an HTTP client inside the image; setup.sh polls
    # GET /api/onboarding on 127.0.0.1 after every deploy instead, and the
    # Uptime Kuma monitor watches it continuously afterwards.
    #
    # Note for anyone adding one later: with server_host: 127.0.0.1 the health
    # probe must target 127.0.0.1 (host networking makes that the same
    # loopback the server is bound to), and `/` answers 302, not 200 —
    # /api/onboarding is the endpoint that answers 200 unauthenticated.
