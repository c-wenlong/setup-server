# Hermes Agent — Nous Research's self-improving AI agent, tailnet-only.
#
# Adapted from the upstream docker-compose.yml
# (github.com/NousResearch/hermes-agent) for this box's conventions:
#
#   1. Upstream uses `network_mode: host` (the gateway wants host-visible
#      ports for its messaging channels). Here the two ports that matter are
#      published on 127.0.0.1 only, on a bridge network — the tailnet is the
#      security boundary, never the LAN.
#   2. The dashboard runs inside the same container as an s6-supervised
#      service (HERMES_DASHBOARD=1), so this is a single container, not the
#      two-container upstream shape.
#   3. The dashboard's auth gate is ON: a non-loopback bind inside the
#      container requires an auth provider, and basic-auth credentials are
#      generated into .env. The tailnet is still the real boundary; basic
#      auth is a second gate over the keys stored in the UI.
#
# Host-specific values and secrets come from .env, generated by setup.sh and
# never overwritten. Compose auto-loads it for interpolation; it is
# deliberately NOT passed as env_file.

name: hermes-agent

services:
  gateway:
    container_name: hermes-agent
    image: nousresearch/hermes-agent:${HERMES_VERSION:-v0.22.5}
    restart: unless-stopped
    # /init (s6-overlay) must stay first in the entrypoint chain — it runs the
    # uid/gid remap and supervision tree. `gateway run` under it is a
    # heartbeat; s6 restarts the real gateway process on crash.
    command: ["gateway", "run"]
    environment:
      # The s6 stage2 hook remaps the internal `hermes` user onto these ids so
      # the bind-mounted data dir stays readable/writable from the host.
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      TZ: ${TZ:-Etc/UTC}
      # Web dashboard, supervised alongside the gateway in this container.
      # 0.0.0.0 inside the container is what makes the published 127.0.0.1
      # port reachable; with an auth provider set, that non-loopback bind
      # engages the login gate rather than opening the UI.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?HERMES_DASHBOARD_PASSWORD missing from .env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:?HERMES_DASHBOARD_SECRET missing from .env}
      # OpenAI-compatible API + health endpoint on :8642, key-gated,
      # published on loopback only for other services on this box.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY missing from .env}
    volumes:
      # Config, API keys, sessions, skills, memories — everything. To move
      # it, change HERMES_DATA in .env and move the directory by hand.
      - ${HERMES_DATA:?HERMES_DATA missing from .env}:/opt/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      # loopback only — the tailnet is the security boundary
      - '127.0.0.1:${LOCAL_PORT:-9119}:9119'   # web dashboard
      - '127.0.0.1:${API_PORT:-8642}:8642'     # OpenAI-compatible API + health
    healthcheck:
      # The API server's health endpoint needs no key.
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8642/health',timeout=5).status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
