# OpenClaw — self-hosted AI assistant gateway, tailnet-only.
#
# Adapted from the upstream docker-compose.yml (github.com/openclaw/openclaw)
# for this box's conventions:
#
#   1. The Gateway port is published on 127.0.0.1 only (upstream binds
#      0.0.0.0:18789). Tailscale Serve terminates TLS in front of it.
#   2. The bridge (:18790) and Teams (:3978) listeners are NOT published —
#      nothing here uses them yet. Uncomment when a channel needs them.
#   3. The pre-built GHCR image is used (upstream default builds from source,
#      which wants 6 GB of RAM on a 7.7 GB box).
#   4. `openclaw-cli` sits behind a `cli` profile so `up -d` never starts it;
#      it is a `docker compose run --rm` tool, not a daemon.
#
# Host-specific values and secrets come from .env, generated by setup.sh and
# never overwritten. Compose auto-loads it for interpolation; it is
# deliberately NOT passed as env_file, so the gateway token is handed to the
# container through the environment block alone.

name: openclaw

services:
  openclaw-gateway:
    container_name: openclaw-gateway
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_VERSION:-2026.10.7}
    restart: unless-stopped
    init: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # Container-side state, workspace and config paths are pinned so host
      # paths from .env (used only as bind-mount sources) cannot leak into
      # runtime code that resolves these vars inside the container.
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      # .env controls host publishing; in-container clients use the fixed
      # internal listener.
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN missing from .env}
      # mDNS cannot work inside a container on a bridge network anyway.
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:?OPENCLAW_CONFIG_DIR missing from .env}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:?OPENCLAW_WORKSPACE_DIR missing from .env}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:?OPENCLAW_AUTH_PROFILE_SECRET_DIR missing from .env}:/home/node/.config/openclaw
      - /etc/localtime:/etc/localtime:ro
    ports:
      # loopback only — the tailnet is the security boundary
      - '127.0.0.1:${LOCAL_PORT:-18789}:18789'
      # Channel listeners, off until a channel needs them:
      #   - '127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790'   # node bridge
      #   - '127.0.0.1:${OPENCLAW_MSTEAMS_PORT:-3978}:3978'    # MS Teams
    extra_hosts:
      # Lets bundled local-model providers reach host ollama/LM Studio via
      # http://host.docker.internal:<port> on Linux Docker Engine too.
      - "host.docker.internal:host-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "dist/docker-healthcheck.js",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-off CLI sharing the gateway's network namespace, so its localhost
  # IS the gateway's listener. Never long-running: `up -d` skips it via the
  # `cli` profile; run it on demand:
  #   docker compose --project-directory <dir> run --rm openclaw-cli status
  #   docker compose --project-directory <dir> run --rm openclaw-cli \
  #     channels add --channel telegram --token "<token>"
  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_VERSION:-2026.10.7}
    profiles: ["cli"]
    network_mode: "service:openclaw-gateway"
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN missing from .env}
      BROWSER: echo
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:?}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:?}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:?}:/home/node/.config/openclaw
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

# The subnet is pinned so `gateway.trustedProxies` can name it in
# openclaw.json: every request arrives through docker-proxy from this
# network's gateway, and the gateway 403s forwarded headers from a proxy it
# does not trust. An unpinned subnet would move on network recreation and
# silently break the tailnet path.
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.144.0/24
