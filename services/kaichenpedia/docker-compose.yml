services:
  # The Next.js app from the repo's site/Dockerfile. deploy.sh builds the
  # image (tagged kaichenpedia:<sha>) and passes it in as KAICHENPEDIA_IMAGE;
  # the app serves both the pages and /api/* itself.
  kaichenpedia:
    image: ${KAICHENPEDIA_IMAGE:-kaichenpedia:local}
    container_name: kaichenpedia
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8091}:8080"
    environment:
      PORT: "8080"
      # Docker sets HOSTNAME to the container id; Next's standalone server
      # binds to $HOSTNAME, so pin it to all interfaces inside the container.
      HOSTNAME: "0.0.0.0"
      # All optional except GH_TOKEN (needed by /api/save + copilot).
      # Leave COPILOT_SECRET empty on this tailnet-only deploy = open mode.
      GH_TOKEN: ${GH_TOKEN:-}
      COPILOT_SECRET: ${COPILOT_SECRET:-}
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-}
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      COPILOT_BASE_URL: ${COPILOT_BASE_URL:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODELS_ALLOWED_HOSTS: ${MODELS_ALLOWED_HOSTS:-}
