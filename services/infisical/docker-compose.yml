# Infisical — self-hosted secrets manager (env vars, API keys, certs),
# tailnet-only.
#
# Derived from the official docker-compose.prod.yml
# (github.com/Infisical/infisical, Self-hosting → Docker Compose docs)
# with these changes:
#
#   1. One published port, loopback only. Upstream binds 0.0.0.0:80.
#      Tailscale Serve terminates TLS, so we publish
#      127.0.0.1:LOCAL_PORT (default 8110) -> container :8080.
#   2. Image tags pinned. Upstream floats `latest`, `redis` and
#      `postgres:14-alpine`.
#   3. restart: unless-stopped on all three (repo convention; upstream
#      mixes `always` and `unless-stopped`).
#   4. Secrets come from .env via interpolation, not env_file — the file
#      also carries the generated admin password, and env_file would hand
#      every value to every container that lists it.
#   5. SITE_URL is the tailnet HTTPS URL, resolved by setup.sh and baked
#      into .env — every login redirect, emailed link and CORS default is
#      built from it.
#   6. Telemetry off (TELEMETRY_ENABLED=false).
#
# Postgres and Redis are unpublished: they only answer on the compose
# network. HOST=0.0.0.0 makes the app listen on all interfaces inside its
# own network namespace — required for the bridge to reach it (upstream's
# HOST default is localhost). This is not the LAN bind the security model
# forbids: the host-side publish below stays loopback-only.
#
# Host-specific values and credentials come from .env, generated by
# setup.sh and never overwritten. Compose auto-loads it from the project
# directory for interpolation.

name: infisical

x-logging: &logging-config
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  infisical:
    container_name: infisical
    image: infisical/infisical:${INFISICAL_VERSION:-v0.167.6}
    restart: unless-stopped
    logging: *logging-config
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      # ENCRYPTION_KEY is the root for every secret at rest. Generated
      # once into .env — rotating it on a live instance makes everything
      # already encrypted unreadable.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY missing from .env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET missing from .env}
      DB_CONNECTION_URI: postgresql://${POSTGRES_USER:-infisical}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from .env}@db:5432/${POSTGRES_DB:-infisical}
      REDIS_URL: redis://redis:6379
      SITE_URL: ${SITE_URL:?SITE_URL missing from .env}
      TELEMETRY_ENABLED: "false"
      TZ: ${TZ:-Etc/UTC}
    ports:
      # loopback only — the tailnet is the security boundary
      - '127.0.0.1:${LOCAL_PORT:-8110}:8080'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node is the app's own runtime; the image ships no curl/wget.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    container_name: infisical-db
    image: postgres:${POSTGRES_VERSION:-16.15-alpine}
    restart: unless-stopped
    logging: *logging-config
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infisical}
      POSTGRES_USER: ${POSTGRES_USER:-infisical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # The vault: every secret, user, org and project. Named volume, not
      # a bind mount — Postgres refuses a host-owned data dir.
      - infisical-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-infisical} -d ${POSTGRES_DB:-infisical}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    container_name: infisical-redis
    image: redis:${REDIS_VERSION:-7.4-alpine}
    restart: unless-stopped
    logging: *logging-config
    volumes:
      # Cache + job queue — regenerable, but keeps jobs across restarts.
      - infisical-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  infisical-postgres:
  infisical-redis:
