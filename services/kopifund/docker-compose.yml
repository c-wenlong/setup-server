# Kopifund — personal finance tracker for Singapore (PDF statements -> one
# categorised ledger), tailnet-only.
#
# The image is built from the machine-managed clone at $REPO_DIR — upstream
# ships its own Dockerfile, so there is nothing to re-specify here. Build
# provenance: `docker inspect kopifund` lists the image, and
# `git -C $REPO_DIR rev-parse HEAD` says what it was built from; setup.sh
# hard-resets that clone per run, so the pair can never drift.
#
# The data folder is the unusual part: ${KOPIFUND_DATA} is ~/.kopifund, an
# unlocked git-crypt clone of the private kopifund-hub repo, mounted at
# /data. The kopifund-sync user timer snapshots it back to the hub — that
# is the versioning and the Mac sync, so the container owns no state of its
# own and the data lives outside ~/services on purpose.
#
# Host-specific values come from .env, generated by setup.sh and never
# overwritten. Compose auto-loads it for interpolation.

name: kopifund

services:
  kopifund:
    container_name: kopifund
    build:
      context: ${REPO_DIR:?REPO_DIR missing from .env}
    image: kopifund-local:latest
    restart: unless-stopped
    environment:
      # Upstream reads KOPIFUND_DATA as its data root (server/finance/paths.py).
      KOPIFUND_DATA: /data
      # The tailnet identity the phone-link QR advertises. A container holds
      # no tailscale to ask, so setup.sh resolves the name and bakes both
      # into .env (SPEC, "Phone link").
      KOPIFUND_HOSTS: ${KOPIFUND_HOSTS:?KOPIFUND_HOSTS missing from .env}
      KOPIFUND_TAILNET_URL: ${KOPIFUND_TAILNET_URL:?KOPIFUND_TAILNET_URL missing from .env}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # Statements, kopifund.db, devices.json, config.toml — everything, and
      # also the synced git worktree. To move it, change KOPIFUND_DATA in
      # .env and move the clone by hand.
      - ${KOPIFUND_DATA:?KOPIFUND_DATA missing from .env}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      # loopback only — the tailnet is the security boundary; Serve fronts
      # HTTPS and the app also gates non-loopback reads on device tokens.
      - '127.0.0.1:${LOCAL_PORT:-8300}:8770'
    healthcheck:
      # The image is a python:3.14 base — stdlib urllib, no wget/curl needed.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
