<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="theme-color" content="#f5f5f6">
<script>
/* A path mount like /home only prefixes relative URLs when it ends in /.
   On `/home` (no slash) every asset would resolve at the vhost root and
   hit whatever service lives there. Bounce to the slash form first so
   none of that gets requested; replace() keeps the bounce out of history.
   Page URLs ending in .html are left alone — their assets resolve beside
   the file correctly, and appending a slash would 404 them. A dotted
   mount like /home.v2 still redirects. */
if (!location.pathname.endsWith('/') && !/\.html?$/i.test(location.pathname)) {
  location.replace(location.pathname + '/' + location.search + location.hash);
}
/* Paint the chosen theme before CSS so the first frame is not the wrong
   one. view.js owns the control and the same localStorage key. */
(function () {
  var t = 'system';
  try { t = localStorage.getItem('launcher.theme') || 'system'; } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = 'system';
  document.documentElement.setAttribute('data-theme', t);
  var dark = t === 'dark' || (t === 'system' && window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  var meta = document.getElementById('theme-color');
  if (meta) meta.setAttribute('content', dark ? '#0e0e11' : '#f5f5f6');
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Launcher">
<meta name="robots" content="noindex">
<title>Launcher</title>
<!-- Relative on purpose: the page is served at both `/` and `/home/`. -->
<link rel="icon" href="icons/favicon.png">
<!-- Full-bleed square, deliberately not pre-rounded: iOS applies its own
     squircle mask and a pre-rounded icon comes out double-rounded. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="notes.css">
<link rel="stylesheet" href="tooltip.css">
<link rel="stylesheet" href="view.css">
<link rel="stylesheet" href="catalogue.css">
</head>
<body>

<a class="skip" href="#grid">Skip to services</a>

<div class="wrap">

  <header class="head" id="head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <img src="icons/launcher.png" alt="" width="32" height="32" decoding="async">
      </span>
      <span class="brand-text">
        <h1>Launcher</h1>
        <span class="host" id="host">&nbsp;</span>
      </span>
    </div>

    <div class="searchrow" id="searchrow">
      <div class="search" id="search">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <circle cx="11" cy="11" r="6.4"/><path d="m15.7 15.7 4.3 4.3"/>
          </svg>
        </span>
        <label class="sr-only" for="filter">Filter services</label>
        <input id="filter" type="search" placeholder="Filter" enterkeyhint="search" inputmode="search"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>

      <div class="gfilter" id="gfilter">
        <button class="iconbtn gfilter-btn" id="gfilter-btn" type="button"
                aria-haspopup="true" aria-expanded="false" aria-controls="gfilter-menu">
          <span class="gfilter-label" id="gfilter-label">Categories</span>
          <svg class="gfilter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <path d="m6 9.5 6 6 6-6"/>
          </svg>
        </button>
        <div class="gfilter-menu" id="gfilter-menu" hidden role="group" aria-label="Categories"></div>
      </div>

      <a class="iconbtn cat-link" id="cat-link" href="#/catalogue">Catalogue</a>

      <button class="iconbtn theme-btn" id="theme-btn" type="button" aria-label="Theme: System">
      </button>
    </div>
  </header>

  <main>
   <div id="view-grid">
    <div class="notice" id="notice" hidden>
      <div class="notice-body">
        <p class="notice-title" id="notice-title">Can't reach the launcher API</p>
        <p class="notice-text" id="notice-text"></p>
      </div>
      <button class="btn" id="notice-retry" type="button">Retry</button>
    </div>

    <!-- The tab strip and the v3 view/sort toolbar share one hairline rule,
         and wrap onto two lines when they cannot sit side by side. -->
    <div class="toolrow" id="toolrow">
    <div class="tabs" id="tabs" role="tablist" aria-label="Filter by state">
      <button class="tab" type="button" role="tab" id="tab-all" data-tab="all"
              aria-controls="panel" aria-selected="true" tabindex="0">
        <span class="tab-label">All</span><span class="tab-n" id="tab-n-all"></span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-active" data-tab="active"
              aria-controls="panel" aria-selected="false" tabindex="-1">
        <span class="tab-label">Active</span><span class="tab-n" id="tab-n-active"></span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-paused" data-tab="paused"
              aria-controls="panel" aria-selected="false" tabindex="-1">
        <span class="tab-label">Paused</span><span class="tab-n" id="tab-n-paused"></span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-uninstalled" data-tab="uninstalled"
              aria-controls="panel" aria-selected="false" tabindex="-1">
        <span class="tab-label">Uninstalled</span><span class="tab-n" id="tab-n-uninstalled"></span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-c-wenlong" data-tab="c-wenlong"
              aria-controls="panel" aria-selected="false" tabindex="-1">
        <span class="tab-label">c-wenlong</span><span class="tab-n" id="tab-n-c-wenlong"></span>
      </button>
    </div>

    <!-- Mount point for view.js's View/Sort/Group-by controls. Empty until
         it loads; if it never does, the grid below is exactly what it always
         was. -->
    <div id="view-toolbar"></div>
    </div><!-- /.toolrow -->

    <div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-all">
      <div class="grid" id="grid" role="list" aria-busy="true"></div>

      <!-- Table and board. view.js renders into these; app.js hides #grid
           when the toolbar says Table or Board. -->
      <div id="view-table"></div>
      <div id="view-board"></div>

      <p class="empty" id="empty" hidden>No service matches that.</p>
    </div>
   </div>

   <!-- Detail view. Same page, hash-routed (#/service/<key>), so Back works
        and the grid keeps its tab, filter and scroll position underneath. -->
   <section class="detail" id="view-detail" aria-labelledby="d-title" hidden>

     <button class="d-back" id="d-back" type="button">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
         <path d="M14.5 5.5 8 12l6.5 6.5"/>
       </svg>
       <span>Services</span>
     </button>

     <div class="d-note" id="d-note" role="status" hidden></div>

     <div class="d-head">
       <span class="d-icon" id="d-icon" aria-hidden="true"></span>
       <span class="d-headtext">
         <h2 id="d-title">&nbsp;</h2>
         <span class="d-sub" id="d-sub"></span>
       </span>
     </div>

     <!-- No launch link and no URL here on purpose: opening a service is the
          grid's job. This page is description, config and env vars. -->

     <!-- Two columns from `--bp-2col` up, stacked below it. The breadcrumb and
          the head row above span the full width; only the body splits. -->
     <div class="d-cols">
      <div class="d-main">

     <section class="d-sec">
       <h3 class="d-sec-h">Name and description</h3>

       <p class="field">
         <label class="field-label" for="d-name">Name</label>
         <input class="field-input" id="d-name" type="text" autocomplete="off"
                autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="120">
       </p>

       <p class="field">
         <label class="field-label" for="d-desc">Description</label>
         <textarea class="field-input field-area" id="d-desc" rows="4" spellcheck="false"></textarea>
       </p>

       <p class="field-hint">
         Saved on the box, not in the repo. Clear a field and it goes back to the
         name shipped in <code>services.json</code>.
       </p>
       <p class="field-status" id="d-save" role="status" aria-live="polite"></p>
     </section>

     <!-- Mount point for view.js's Resources block. Deliberately in the main
          column, not the notes column beside it. -->
     <div id="view-res"></div>

     <section class="d-sec" id="d-env-sec" hidden>
       <h3 class="d-sec-h">Environment</h3>
       <p class="d-sec-sub" id="d-env-path"></p>
       <dl class="env" id="d-env"></dl>
       <p class="d-empty" id="d-env-empty" hidden></p>
     </section>

     <section class="d-sec" id="d-meta-sec" hidden>
       <h3 class="d-sec-h">Registry</h3>
       <dl class="meta" id="d-meta"></dl>
     </section>

      </div><!-- /.d-main -->

      <!-- Second column. Mount point for the notes module (notes.js), which
           is self-contained: it reads the service key from the hash and
           renders itself here, so notes evolve without touching app.js. -->
      <aside class="d-side" aria-label="Notes">
        <div id="notes-mount"></div>
      </aside>
     </div><!-- /.d-cols -->

   </section>

   <!-- Catalogue view (#/catalogue). Painted entirely by catalogue.js from
        the list app.js already polls; installs go through app.js's own
        deploy sheet. -->
   <section class="cat" id="view-catalogue" aria-labelledby="cat-title" hidden></section>
  </main>

</div>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-card" id="sheet-card">
    <div class="sheet-head">
      <span class="sheet-icon" id="sheet-icon" aria-hidden="true"></span>
      <span class="sheet-headtext">
        <h2 id="sheet-title">Deploy</h2>
        <span class="sheet-sub" id="sheet-sub"></span>
      </span>
    </div>

    <p class="sheet-body" id="sheet-body"></p>

    <div class="sheet-alert" id="sheet-alert" role="alert" hidden></div>

    <div class="sheet-run" id="sheet-run" hidden>
      <div class="run-head">
        <span class="pill" id="run-pill">Running</span>
        <span class="run-exit" id="run-exit"></span>
      </div>
      <pre class="log" id="run-log" tabindex="0" aria-label="Deploy log"></pre>
    </div>

    <div class="sheet-actions" id="sheet-actions">
      <button class="btn" id="btn-cancel" type="button">Cancel</button>
      <button class="btn btn-primary" id="btn-confirm" type="button">Deploy</button>
    </div>
  </div>
</div>

<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<script src="icons.js"></script>
<script src="view.js"></script>
<script src="app.js"></script>
<script src="notes.js"></script>
<script src="catalogue.js"></script>
<script src="tooltip.js"></script>
</body>
</html>
