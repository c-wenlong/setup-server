# Forgejo — self-hosted Git forge (a GitHub you own), tailnet-only.
#
# Deliberately simpler than the upstream example compose
# (codeberg.org/forgejo/forgejo docs, "Installation with Docker"):
#
#   1. SQLite instead of a Postgres sidecar. SQLite is compiled into the
#      image (sqlite, sqlite_unlock_notify) and this box has 7.7 GB of RAM
#      shared with ollama and Immich — a second database container is pure
#      overhead for a single-user forge. Measured footprint: ~100 MiB idle,
#      ~120 MiB in use.
#   2. The HTTP port is published on 127.0.0.1 only (upstream binds
#      0.0.0.0:3000). Tailscale Serve terminates TLS in front of it.
#   3. The built-in SSH server is off by default; see the ports block below.
#   4. No first-run web wizard: INSTALL_LOCK is set, so /install returns 404
#      and every setting comes from the environment below.
#
# All configuration is FORGEJO__<section>__<KEY> environment variables (double
# underscores). The image's entrypoint folds them into
# /data/gitea/conf/app.ini on *every* start, so changing a value here or in
# .env and re-running setup.sh actually moves the running config — app.ini is
# a derived file, not the source of truth.
#
# Host-specific values and secrets come from .env, generated by setup.sh and
# never overwritten. Compose auto-loads it from the project directory for
# interpolation; it is deliberately NOT passed as env_file, so the admin
# password in .env is never handed to the container.

name: forgejo

services:
  forgejo:
    container_name: forgejo
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-15}
    restart: always
    environment:
      # Remap the container's `git` user onto the host user that owns
      # ${FORGEJO_DATA}, so the bind mount stays writable and repositories are
      # readable from the host. Do NOT add a top-level `user:` here — the
      # entrypoint has to start as root to rewrite /etc/passwd and take the
      # s6 supervision lock; it drops to `git` on its own. (Verified: with
      # `user:` set, the container dies with "sed: can't create temp file
      # '/etc/passwdXXXXXX'".)
      USER_UID: ${FORGEJO_UID:-1000}
      USER_GID: ${FORGEJO_GID:-1000}
      TZ: ${TZ:-Etc/UTC}

      # --- server -------------------------------------------------------
      # ROOT_URL must be the *public* tailnet URL. Forgejo builds every clone
      # URL, redirect, webhook payload and API html_url from it; get it wrong
      # and nothing errors, you just get unusable localhost links. setup.sh
      # resolves it from `tailscale status --json` and bakes it into .env.
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:?FORGEJO_DOMAIN missing from .env}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:?FORGEJO_ROOT_URL missing from .env}
      FORGEJO__server__HTTP_PORT: 3000
      # Git LFS. Off by default in this image; on here because a forge that
      # silently rejects LFS pushes is a bad surprise. Storage lives in the
      # same volume (/data/git/lfs).
      FORGEJO__server__LFS_START_SERVER: "true"

      # --- built-in SSH server (off) ------------------------------------
      # Host port 22 belongs to the box's own sshd, and Tailscale Serve
      # fronts HTTPS only — so clone over HTTPS, which works fine on the
      # tailnet. See .env / SETUP.md for how to turn SSH on.
      FORGEJO__server__DISABLE_SSH: ${FORGEJO_DISABLE_SSH:-true}
      FORGEJO__server__START_SSH_SERVER: ${FORGEJO_START_SSH_SERVER:-false}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN:?}
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_HOST_PORT:-2222}
      FORGEJO__server__SSH_LISTEN_PORT: 22

      # --- database -----------------------------------------------------
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/gitea.db

      # --- security -----------------------------------------------------
      # INSTALL_LOCK skips the web install wizard entirely (/install -> 404).
      # SECRET_KEY encrypts 2FA secrets and stored mirror/OAuth credentials;
      # the image leaves it EMPTY otherwise, which falls back to a built-in
      # key. Generated once into .env — changing it later makes anything
      # already encrypted unreadable.
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:?FORGEJO_SECRET_KEY missing from .env}

      # --- service ------------------------------------------------------
      # Single-user instance on a private tailnet: nobody signs themselves
      # up. New accounts, if ever needed:
      #   docker exec -u git forgejo forgejo admin user create --username ...
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    volumes:
      # Repositories, SQLite DB, avatars, LFS — everything. To move it,
      # change FORGEJO_DATA in .env and move the directory by hand.
      - ${FORGEJO_DATA:?FORGEJO_DATA missing from .env}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      # loopback only — the tailnet is the security boundary
      - '127.0.0.1:${LOCAL_PORT:-3000}:3000'
      # To enable SSH clones later:
      #   1. uncomment the line below (2222 is a suggestion; anything free
      #      that is not 22 works — 22 is the host's own sshd)
      #   2. in .env: FORGEJO_DISABLE_SSH=false, FORGEJO_START_SSH_SERVER=true,
      #      FORGEJO_SSH_HOST_PORT=2222
      #   3. publish it on the tailnet: tailscale serve --bg --tcp=2222 \
      #        tcp://127.0.0.1:2222
      #   4. ./setup.sh   (recreates the container and re-derives app.ini)
      # - '127.0.0.1:${FORGEJO_SSH_HOST_PORT:-2222}:22'
    healthcheck:
      # busybox wget, present in the image — no curl inside.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
