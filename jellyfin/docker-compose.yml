# Jellyfin — self-hosted media server (Netflix for your own files), tailnet-only.
#
# Differences from the upstream example compose
# (jellyfin.org/docs/general/installation/container, "Docker Compose"):
#
#   1. The HTTP port is published on 127.0.0.1 only (upstream binds
#      0.0.0.0:8096). Tailscale Serve terminates TLS in front of it, and the
#      tailnet is the auth boundary.
#   2. No `network_mode: host` and no DLNA/auto-discovery ports (UDP 1900
#      and 7359). Those exist so TVs on the LAN can find the server by
#      broadcast; this server is deliberately not on the LAN. Clients are
#      pointed at the tailnet URL by hand instead.
#   3. The media directory is mounted READ-ONLY. Jellyfin keeps its metadata,
#      artwork and transcodes under /config by default, so it never needs to
#      write into the library — and a read-only mount means a bad plugin or a
#      mis-click in the library editor cannot delete the media.
#   4. Software transcoding only. See the hardware acceleration block below.
#
# Host-specific values and secrets come from .env, generated by setup.sh and
# never overwritten. Compose auto-loads it from the project directory for
# interpolation; it is deliberately NOT passed as env_file, so the admin
# password in .env is never handed to the container.

name: jellyfin

services:
  jellyfin:
    container_name: jellyfin
    # Pinned to 12.0 exactly (reports 12.0.0). Do not float to `latest`: a
    # media server that silently jumps a major version can invalidate the
    # library database and the client apps' saved credentials.
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-12.0}
    restart: always
    # Run as the host user that owns ${JELLYFIN_CONFIG} and ${JELLYFIN_CACHE}.
    # The official image starts as root otherwise and every file it writes into
    # the bind mounts ends up root-owned — backing up or moving the library
    # then needs sudo. setup.sh creates both directories first and checks they
    # are writable, so there is nothing for an entrypoint to chown.
    user: '${JELLYFIN_UID:-1000}:${JELLYFIN_GID:-1000}'
    environment:
      TZ: ${TZ:-Etc/UTC}
      # The address Jellyfin hands to clients for streaming, remote sessions,
      # "cast to device" and the QR/quick-connect flows. Without it the server
      # advertises the container's own address and clients are told to fetch
      # video from 127.0.0.1 — which fails on every device except this box.
      # setup.sh resolves it from `tailscale status --json` and bakes it into
      # .env; it warns when the value drifts from the live tailnet name.
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_URL:?JELLYFIN_PUBLISHED_URL missing from .env}
    volumes:
      # Library database, users, metadata, artwork, plugins, transcode
      # temp — everything worth backing up.
      - ${JELLYFIN_CONFIG:?JELLYFIN_CONFIG missing from .env}:/config
      # Images and subtitle caches. Regenerable; safe to delete when cold.
      - ${JELLYFIN_CACHE:?JELLYFIN_CACHE missing from .env}:/cache
      # The library itself, read-only (see note 3 above). Point MEDIA_DIR in
      # .env at wherever the films/shows/music actually live and re-run
      # setup.sh; add more `:ro` lines here for additional libraries.
      - ${MEDIA_DIR:?MEDIA_DIR missing from .env}:/media:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # loopback only — the tailnet is the security boundary
      - '127.0.0.1:${LOCAL_PORT:-8096}:8096'
    # No healthcheck block on purpose: the image already ships one
    # (`curl -fsS $HEALTHCHECK_URL` against http://localhost:8096/health,
    # 30s interval), so `docker ps` reports health without duplicating it.

    # --- hardware transcoding (NVENC) — OFF, and it cannot be turned on here --
    # This box has a GTX 1070 and driver 580.173.02, but Docker has no `nvidia`
    # runtime (`docker info` shows only io.containerd.runc.v2 and runc) because
    # nvidia-container-toolkit is not installed. Uncommenting the block below
    # without that prerequisite makes the container fail to start.
    #
    # Prerequisite (one time, needs sudo):
    #   sudo apt-get install -y nvidia-container-toolkit &&
    #     sudo nvidia-ctk runtime configure --runtime=docker &&
    #     sudo systemctl restart docker
    #
    # Then uncomment, re-run setup.sh, and turn on NVENC in
    # Dashboard -> Playback -> Transcoding (hardware acceleration: NVENC).
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    #
    # Until then transcoding is software (ffmpeg on the Ryzen 5 2600), which
    # handles 1080p comfortably. Direct play — the client rendering the file
    # as-is — needs no transcode at all and is the common case.
