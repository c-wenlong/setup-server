# Immich — self-hosted photo/video library (Google Photos replacement),
# tailnet-only.
#
# Derived from the official v3.1.0 release compose
# (github.com/immich-app/immich/releases/latest/download/docker-compose.yml)
# with four deliberate changes for this box:
#
#   1. The server port is published on 127.0.0.1 only (upstream binds
#      0.0.0.0:2283). Tailscale Serve terminates TLS in front of it.
#   2. The machine-learning container sits behind the `ml` compose profile,
#      so a low-RAM host can run Immich without it. setup.sh owns the
#      COMPOSE_PROFILES line in .env; see SETUP.md "Machine learning".
#   3. The ML container gets a hard mem_limit — on a 7.7 GB host an
#      unbounded ML worker is the one container that can OOM everything else.
#   4. Postgres shm_size is raised from 128mb to 1gb: HNSW index builds on
#      the vector columns otherwise hit "could not resize shared memory
#      segment" during a large import.
#
# redis/postgres image digests are pinned exactly as upstream ships them —
# the postgres image is Immich's own build with vectorchord + pgvectors, and
# a stock postgres image will NOT work.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Do not edit the next line. To move media, change UPLOAD_LOCATION in .env
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # loopback only — the tailnet is the security boundary
      - '127.0.0.1:${LOCAL_PORT:-2283}:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    profiles: [ml]
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    mem_limit: ${ML_MEM_LIMIT:-3g}
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Do not edit the next line. To move the DB, change DB_DATA_LOCATION in .env
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 1gb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
